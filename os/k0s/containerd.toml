#
# containerd's config for k0s. k0s writes /etc/k0s/containerd.toml itself
# unless the file is user managed (no "k0s_managed" first line), and /etc is
# read-only here, so the root carries this one: what k0s would write, with
# the sandbox image pinned by the digest bundled in the root. Keep it in
# step with spec.images.pause in k0s.yaml.tmpl (os/k0s/config_test.go).
version = 3
imports = ["/etc/k0s/containerd.d/*.toml"]

[plugins."io.containerd.cri.v1.images".pinned_images]
sandbox = "quay.io/k0sproject/pause:3.10.2-0@sha256:1dca17073186db812f380970077f5c82842c810f1bd75800cd926ab50cd34243"
