# OpenSSH sshd through sneakers-sshd-run, which renders and checks its
# config and rebinds on netd's address events. Key-only, into the closed
# shell. During first boot it starts at the SSH key step (enrol mode until
# an owner has a key); in normal operation it always runs.
exec: /usr/bin/sneakers-sshd-run
args: [--mode, auto]
phases: [firstboot, normal]
on-demand-in: [firstboot]
after: [netd, accessd]
restart: always
