# k0s: the cluster (spec 1 Section 3.6, spec 3 Section 2.12), the
# controller with its worker and a one-member etcd, not --single, so more
# nodes can join later. Normal operation only, once the state is mounted
# (/var/lib/k0s is on it), after netd. Root; its output goes to init's
# console.
# k0s isn't in the base image: it comes with the product bundle, installed
# from Updates into /var/lib/sneakers/product (docs/k0s.md). It waits until
# the first admin exists (setup/done) and a bundle is installed; a product
# apply or revert restarts it through the Services API.
# INTERIM until sneakers-platformd (#99): os/k0s/k0s-interim prepares the
# box and starts `k0s controller --enable-worker --no-taints` with the
# box's node name; platformd takes both over and the entry gets
# `after: [platformd]`.
exec: /bin/sh
args: [/usr/libexec/sneakers/k0s-interim, run]
phases: [normal]
after: [netd]
restart: always
start-when: [/var/lib/sneakers/setup/done, /var/lib/sneakers/product/current/bundle.json]
pre-start: [/bin/sh, /usr/libexec/sneakers/k0s-interim, prepare]
# Before every stop (a reboot, a shutdown, a product apply or revert) the
# product stops latest phase first, so the database stops last and cleanly
# (docs/upgrades.md#the-phases); it gets the stop-timeout too, which
# leaves the database its 2-minute shutdown grace.
pre-stop: [/usr/bin/sneakers-accessd, quiesce]
stop-timeout: 5m
