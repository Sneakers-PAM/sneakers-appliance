# The access service: the access store, sign-in codes and sessions, the OS
# audit log, the rendered accounts and sshd files, and the backend of the
# :8443 API on /run/sneakers/access.sock. Root; init restarts it whenever it
# stops, and logins keep working meanwhile from the files it rendered.
exec: /usr/bin/sneakers-accessd
phases: [firstboot, normal]
restart: always
readiness:
  file: /run/sneakers/access.ready
