// The local API of sneakers-accessd on /run/sneakers/access.sock. The peer
// uid (SO_PEERCRED) is the caller's identity, never a field of a request:
// root is the console (and firstboot), and gets every method here; an
// admin uid is a closed-shell login, acting as that admin with that
// admin's role, and gets only the methods the shell needs; the osadmin uid
// gets BindingService here and the :8443 API of
// sneakers.appliance.osadmin.v1, where every call carries the signed-in
// admin's session.
//
// A closed-shell login may send the SHA256: fingerprint of the key that
// signed it in, in the Sneakers-Key-Fingerprint header, and its SSH client
// address in Sneakers-Source; accessd refuses a fingerprint that isn't one
// of the peer uid's admin's keys.
//
// sshd authenticates SSH logins by the box-issued certificate alone; the
// closed shell's first act is SshLoginService.VerifyTotp, as its admin uid.
syntax = "proto3";

package sneakers.appliance.access.v1;

import "google/protobuf/timestamp.proto";
import "sneakers/appliance/netd/v1/netd.proto";
import "sneakers/appliance/osadmin/v1/access.proto";
import "sneakers/appliance/osadmin/v1/elevation.proto";
import "sneakers/appliance/osadmin/v1/options.proto";
import "sneakers/appliance/osadmin/v1/setup.proto";
import "sneakers/appliance/osadmin/v1/status.proto";

option go_package = "github.com/Sneakers-PAM/sneakers-appliance/gen/go/sneakers/appliance/access/v1;accessv1";

// AccessService is the status, the admins, their keys and the recovery
// keys. An admin manages their own keys; owners manage everyone.
service AccessService {
  // GetStatus is the status page's data. accessd also keeps the last one
  // in /run/sneakers/access/status.json, for when it is down.
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc ListAdmins(ListAdminsRequest) returns (ListAdminsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // AddAdmin is owners only.
  rpc AddAdmin(AddAdminRequest) returns (AddAdminResponse);
  // RemoveAdmin is owners only.
  rpc RemoveAdmin(RemoveAdminRequest) returns (RemoveAdminResponse);
  // ListKeys lists an admin's login keys; empty admin means the caller.
  rpc ListKeys(ListKeysRequest) returns (ListKeysResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // AddKey is no longer served: the box issues SSH keys on :8443 and never
  // takes one an admin brings.
  rpc AddKey(AddKeyRequest) returns (AddKeyResponse) {
    option deprecated = true;
  }
  rpc RemoveKey(RemoveKeyRequest) returns (RemoveKeyResponse);
  // AddRecoveryKey is the console's (root only).
  rpc AddRecoveryKey(AddRecoveryKeyRequest) returns (AddRecoveryKeyResponse);
}

// NetworkService relays the network settings to netd, whose socket is
// root's only.
service NetworkService {
  rpc GetNetwork(GetNetworkRequest) returns (GetNetworkResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc SetNetwork(SetNetworkRequest) returns (SetNetworkResponse);
  rpc ConfirmNetwork(ConfirmNetworkRequest) returns (ConfirmNetworkResponse);
  // ResetAllowList is the console's (root only).
  rpc ResetAllowList(ResetAllowListRequest) returns (ResetAllowListResponse);
}

// SetupService is the first-boot steps accessd owns.
service SetupService {
  rpc GetSetup(GetSetupRequest) returns (GetSetupResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // SetRecoveryKey sets a recovery key during setup (an owner's shell).
  rpc SetRecoveryKey(SetRecoveryKeyRequest) returns (SetRecoveryKeyResponse);
  // AcknowledgeSingleAdmin records, from the console (root only), that the
  // operator confirmed the single-admin warning.
  rpc AcknowledgeSingleAdmin(AcknowledgeSingleAdminRequest) returns (AcknowledgeSingleAdminResponse);
  // Complete checks every step and finishes setup (root only: firstboot).
  rpc Complete(CompleteRequest) returns (CompleteResponse);
  // GetConsoleInfo is what the console shows (root only): the setup code
  // or setup's progress, the :8443 address and its certificate
  // fingerprint, and a live Recover access code.
  rpc GetConsoleInfo(GetConsoleInfoRequest) returns (GetConsoleInfoResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // WatchConsoleInfo sends the console info at once, again on every change
  // (a new code, a browser starting setup, a step done, setup done, a
  // Recover access code used or expired), and at least every 30 seconds
  // (root only).
  rpc WatchConsoleInfo(WatchConsoleInfoRequest) returns (stream WatchConsoleInfoResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // ResetSetupCode stops a browser setup that hasn't made the first admin
  // yet, or clears a locked code, and shows a new code: the console's "this
  // isn't you" and "new code" (root only).
  rpc ResetSetupCode(ResetSetupCodeRequest) returns (ResetSetupCodeResponse);
  // BeginRecoverAccess issues the console's Recover access code (root
  // only): on :8443 it gives an owner a new password and authenticator,
  // or makes a new owner. It works once, for 60 minutes.
  rpc BeginRecoverAccess(BeginRecoverAccessRequest) returns (BeginRecoverAccessResponse);
  // CancelRecoverAccess withdraws a Recover access code (root only).
  rpc CancelRecoverAccess(CancelRecoverAccessRequest) returns (CancelRecoverAccessResponse);
}

// ElevationService is the root shells. A root operator's closed shell asks
// for a challenge (BeginRootShell), the operator gets its code on :8443
// (osadmin.v1 RootShellService), and the shell trades challenge and code
// for a ticket (OpenRootShell). It opens /run/sneakers/rootshell.sock with
// the ticket; accessd runs the recorded root shell on a pty it owns, and
// the shell relays the terminal in the same SSH session.
service ElevationService {
  // BeginRootShell opens a challenge for the caller (an admin uid on the
  // root-operator roster), bound to its SSH client address. It works for
  // the access policy's code lifetime.
  rpc BeginRootShell(BeginRootShellRequest) returns (BeginRootShellResponse);
  // OpenRootShell checks the code typed for a challenge (one use, that
  // challenge only) and returns a one-use ticket for rootshell.sock. Three
  // wrong codes close the challenge.
  rpc OpenRootShell(OpenRootShellRequest) returns (OpenRootShellResponse);
  // RequestElevation is no longer served: BeginRootShell replaced the
  // owner-approved request.
  rpc RequestElevation(RequestElevationRequest) returns (RequestElevationResponse) {
    option deprecated = true;
  }
  rpc ListElevations(ListElevationsRequest) returns (ListElevationsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // GetElevationCertificate is no longer served: no certificate is issued
  // for a root shell.
  rpc GetElevationCertificate(GetElevationCertificateRequest) returns (GetElevationCertificateResponse) {
    option deprecated = true;
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // WithdrawElevation is no longer served.
  rpc WithdrawElevation(WithdrawElevationRequest) returns (WithdrawElevationResponse) {
    option deprecated = true;
  }
  // ApproveElevation is no longer served.
  rpc ApproveElevation(ApproveElevationRequest) returns (ApproveElevationResponse) {
    option deprecated = true;
  }
  // DenyElevation is no longer served.
  rpc DenyElevation(DenyElevationRequest) returns (DenyElevationResponse) {
    option deprecated = true;
  }
  // TerminateElevation ends an active elevated session (root only; owners
  // terminate on :8443).
  rpc TerminateElevation(TerminateElevationRequest) returns (TerminateElevationResponse);
  // BeginElevatedSession is sneakers-elevated's (root only), before it
  // gives a prompt: it uses the ticket from OpenRootShell up and returns
  // the session's limit.
  rpc BeginElevatedSession(BeginElevatedSessionRequest) returns (BeginElevatedSessionResponse);
  // EndElevatedSession is sneakers-elevated's (root only) when the
  // session ends.
  rpc EndElevatedSession(EndElevatedSessionRequest) returns (EndElevatedSessionResponse);
}

// EnrolmentService was the SSH key enrolment window. It is no longer
// served: the first admin is made on the :8443 setup page, and the box
// issues SSH keys. Every method answers Not available.
service EnrolmentService {
  option deprecated = true;
  // OpenEnrolment opens a window for an admin's keys (root only). It
  // generates the SSH host keys when the box has none.
  rpc OpenEnrolment(OpenEnrolmentRequest) returns (OpenEnrolmentResponse);
  // GetEnrolment is the window as the console shows it (root only).
  rpc GetEnrolment(GetEnrolmentRequest) returns (GetEnrolmentResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // AcceptEnrolmentKey stores a key that gave the right code (root only;
  // confirm is the typed yes).
  rpc AcceptEnrolmentKey(AcceptEnrolmentKeyRequest) returns (AcceptEnrolmentKeyResponse);
  // RejectEnrolmentKey refuses a key that gave the right code (root only).
  rpc RejectEnrolmentKey(RejectEnrolmentKeyRequest) returns (RejectEnrolmentKeyResponse);
  // CloseEnrolment closes the window (root only): Done on the console.
  rpc CloseEnrolment(CloseEnrolmentRequest) returns (CloseEnrolmentResponse);
  // OfferEnrolmentKey puts a key typed or fetched on the console into the
  // open window (root only). It waits for the typed yes like a key that
  // gave the code over SSH.
  rpc OfferEnrolmentKey(OfferEnrolmentKeyRequest) returns (OfferEnrolmentKeyResponse);
  // SubmitEnrolmentCode is sneakers-enrol's (the enrol uid only): the
  // code the admin typed and the key sshd authenticated.
  rpc SubmitEnrolmentCode(SubmitEnrolmentCodeRequest) returns (SubmitEnrolmentCodeResponse);
  // GetEnrolmentKey is sneakers-enrol's (the enrol uid only): whether the
  // console has accepted the key yet.
  rpc GetEnrolmentKey(GetEnrolmentKeyRequest) returns (GetEnrolmentKeyResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// SshLoginService is the closed shell's login check (an admin uid). sshd
// has already checked the certificate; the shell asks for the TOTP code
// before anything else, and a refusal ends the session. Every refusal
// counts toward the admin's lockout and the source's throttle, is
// audited, and carries an osadmin.v1.SignInRefusal detail.
service SshLoginService {
  // VerifyTotp checks the caller's TOTP code (a fresh one) and that the
  // key fingerprint in the Sneakers-Key-Fingerprint header is one of the
  // caller's issued keys.
  rpc VerifyTotp(VerifyTotpRequest) returns (VerifyTotpResponse);
  // EndSshLogin records a login's end, for the audit log.
  rpc EndSshLogin(EndSshLoginRequest) returns (EndSshLoginResponse);
}

// BindingService tells sneakers-osadmin where to listen (the osadmin uid
// only): netd's socket is root's.
service BindingService {
  rpc GetBinding(GetBindingRequest) returns (GetBindingResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

message GetStatusRequest {}

message GetStatusResponse {
  sneakers.appliance.osadmin.v1.GetStatusResponse status = 1;
}

message ListAdminsRequest {}

message ListAdminsResponse {
