}

message AddAdminRequest {
  string name = 1;
  sneakers.appliance.osadmin.v1.Role role = 2;
  // public_key is unused: the box issues SSH keys.
  string public_key = 3 [deprecated = true];
  bool root_operator = 4;
}

message AddAdminResponse {
  sneakers.appliance.osadmin.v1.Admin admin = 1;
  // invitation is the new admin's one-time code for :8443.
  sneakers.appliance.osadmin.v1.Invitation invitation = 2;
}

message RemoveAdminRequest {
  string name = 1;
}

message RemoveAdminResponse {}

message ListKeysRequest {
  string admin = 1;
}

message ListKeysResponse {
  string admin = 1;
  repeated sneakers.appliance.osadmin.v1.Key keys = 2;
}

message AddKeyRequest {
  option deprecated = true;
  string admin = 1;
  string public_key = 2;
}

message AddKeyResponse {
  option deprecated = true;
  sneakers.appliance.osadmin.v1.Key key = 1;
}

message RemoveKeyRequest {
  // admin empty means the caller.
  string admin = 1;
  string fingerprint = 2;
}

message RemoveKeyResponse {}

message AddRecoveryKeyRequest {
  string public_key = 1;
  string label = 2;
}

message AddRecoveryKeyResponse {
  sneakers.appliance.osadmin.v1.RecoveryKey recovery_key = 1;
}

message GetNetworkRequest {}

message GetNetworkResponse {
  sneakers.appliance.netd.v1.Settings settings = 1;
  repeated string management_addresses = 2;
  bool ntp_synced = 3;
}

message SetNetworkRequest {
  sneakers.appliance.netd.v1.Settings settings = 1;
}

message SetNetworkResponse {
  string token = 1;
  int32 revert_after_seconds = 2;
}

message ConfirmNetworkRequest {
  string token = 1;
}

message ConfirmNetworkResponse {}

message ResetAllowListRequest {}

message ResetAllowListResponse {
  string token = 1;
  int32 revert_after_seconds = 2;
}

message GetSetupRequest {}

message GetSetupResponse {
  sneakers.appliance.osadmin.v1.GetSetupResponse setup = 1;
}

message SetRecoveryKeyRequest {
  string public_key = 1;
  string label = 2;
}

message SetRecoveryKeyResponse {
  sneakers.appliance.osadmin.v1.RecoveryKey recovery_key = 1;
}

message AcknowledgeSingleAdminRequest {}

message AcknowledgeSingleAdminResponse {}

message CompleteRequest {}

message CompleteResponse {
  string product_setup_url = 1;
}

message RequestElevationRequest {
  option deprecated = true;
  int32 minutes = 1;
  string reason = 2;
}

message RequestElevationResponse {
  option deprecated = true;
  sneakers.appliance.osadmin.v1.Elevation elevation = 1;
}

message ListElevationsRequest {}

message ListElevationsResponse {
  repeated sneakers.appliance.osadmin.v1.Elevation elevations = 1;
}

message GetElevationCertificateRequest {
  option deprecated = true;
  string id = 1;
}

message GetElevationCertificateResponse {
  option deprecated = true;
  // certificate is the OpenSSH certificate, one authorized_keys-style line.
  string certificate = 1;
  google.protobuf.Timestamp valid_before = 2;
  // login is how to use it: ssh -i <key> -o CertificateFile=<file> maint@<host>.
  string login = 3;
}

message WithdrawElevationRequest {
  option deprecated = true;
  string id = 1;
}

message WithdrawElevationResponse {
  option deprecated = true;
}

message ApproveElevationRequest {
  option deprecated = true;
  string id = 1;
  int32 minutes = 2;
}

message ApproveElevationResponse {
  option deprecated = true;
}

message DenyElevationRequest {
  option deprecated = true;
  string id = 1;
}

message DenyElevationResponse {
  option deprecated = true;
}

message TerminateElevationRequest {
  string id = 1;
}

message TerminateElevationResponse {}

message BeginElevatedSessionRequest {
  // certificate is unused: root shells open with a ticket.
  string certificate = 1 [deprecated = true];
  // pid is sneakers-elevated's, so a terminate can reach it.
  int32 pid = 2;
  // ticket is OpenRootShell's.
  string ticket = 3;
  // admin is who the SSH session authenticated as; it must be the
  // ticket's.
  string admin = 4;
}

message BeginElevatedSessionResponse {
  sneakers.appliance.osadmin.v1.Elevation elevation = 1;
  // ends is when the session's time box runs out.
  google.protobuf.Timestamp ends = 2;
}

message EndElevatedSessionRequest {
  string id = 1;
  // reason is exit, idle, time-box or terminated.
  string reason = 2;
  // recording_sha256 is the hex SHA-256 of the whole recording.
  string recording_sha256 = 3;
}

message EndElevatedSessionResponse {}

// Enrolment is an enrolment window as the console shows it.
message Enrolment {
  option deprecated = true;
  bool open = 1;
  string admin = 2;
  // code is XXXX-XXXX (Crockford base32).
  string code = 3;
  google.protobuf.Timestamp opened = 4;
  // idle_until is when the window closes unless something happens.
  google.protobuf.Timestamp idle_until = 5;
  int32 attempts_left = 6;
  repeated sneakers.appliance.osadmin.v1.HostKey host_keys = 7;
  repeated EnrolmentKey keys = 8;
  // enrolled counts the keys accepted in this window.
  int32 enrolled = 9;
  // closed_reason is done, idle, attempts or empty while open.
  string closed_reason = 10;
  // recovery marks the console's Recover access window: each key stored is
  // held from approving elevations for 24 hours.
  bool recovery = 11;
}

// EnrolmentKey is a key that gave the right code.
message EnrolmentKey {
  option deprecated = true;
  string id = 1;
  string fingerprint = 2;
  string type = 3;
  string comment = 4;
  string source_address = 5;
  // state is waiting, accepted or rejected.
  string state = 6;
  // via is enrol (over SSH with the code), typed or url (on the console).
  string via = 7;
}

message OpenEnrolmentRequest {
  option deprecated = true;
  string admin = 1;
  // recovery opens the console's Recover access window (owners only).
  bool recovery = 2;
}

message OpenEnrolmentResponse {
  option deprecated = true;
  Enrolment enrolment = 1;
}

message GetEnrolmentRequest {
  option deprecated = true;
}

message GetEnrolmentResponse {
  option deprecated = true;
  Enrolment enrolment = 1;
}

message AcceptEnrolmentKeyRequest {
  option deprecated = true;
  string id = 1;
  // confirm must be yes.
  string confirm = 2;
}

message AcceptEnrolmentKeyResponse {
  option deprecated = true;
  sneakers.appliance.osadmin.v1.Key key = 1;
}

message RejectEnrolmentKeyRequest {
  option deprecated = true;
  string id = 1;
}

message RejectEnrolmentKeyResponse {
  option deprecated = true;
}

message CloseEnrolmentRequest {
  option deprecated = true;
}

message OfferEnrolmentKeyRequest {
  option deprecated = true;
  // public_key is one authorized_keys line.
  string public_key = 1;
  // via is typed or url.
  string via = 2;
  // from is the URL a fetched key came from.
  string from = 3;
}

message OfferEnrolmentKeyResponse {
  option deprecated = true;
  EnrolmentKey key = 1;
}

message CloseEnrolmentResponse {
  option deprecated = true;
}

message SubmitEnrolmentCodeRequest {
  option deprecated = true;
  string code = 1;
  // public_key is the key sshd authenticated, from SSH_USER_AUTH.
  string public_key = 2;
}

message SubmitEnrolmentCodeResponse {
  option deprecated = true;
  string id = 1;
  string admin = 2;
  string fingerprint = 3;
}

message GetEnrolmentKeyRequest {
  option deprecated = true;
  string id = 1;
}

message GetEnrolmentKeyResponse {
  option deprecated = true;
  EnrolmentKey key = 1;
}

message GetBindingRequest {}

message GetBindingResponse {
  string hostname = 1;
  // management_addresses are the addresses :8443 binds (no link-local).
  repeated string management_addresses = 2;
}

// SetupState is where first boot's setup is, as the console shows it.
enum SetupState {
  SETUP_STATE_UNSPECIFIED = 0;
  // SETUP_STATE_NOT_STARTED: the console shows the setup code.
  SETUP_STATE_NOT_STARTED = 1;
  // SETUP_STATE_IN_PROGRESS: a browser redeemed the code; the console
  // shows where it is.
  SETUP_STATE_IN_PROGRESS = 2;
  // SETUP_STATE_DONE: setup finished; the console shows the status.
  SETUP_STATE_DONE = 3;
}

// ConsoleInfo is what the console shows about access.
message ConsoleInfo {
  SetupState state = 1;
  // setup_code is XXXX-XXXX-XXXX-XXXX while the state is not started and
  // the code isn't locked. Only this message carries it, to the console; no
  // :8443 call returns it.
  string setup_code = 2;
  // code_expires is when a new code replaces it (60 minutes).
  google.protobuf.Timestamp code_expires = 3;
  // attempts_left is the wrong tries left before the code locks.
  int32 attempts_left = 4;
  // url is :8443 on the first management address, https://<address>:8443.
  string url = 5;
  // urls are :8443 on every management address.
  repeated string urls = 6;
  // cert_fingerprint is the SHA-256 of :8443's certificate, upper-case
  // hex with no separators (the console groups it in fours).
  string cert_fingerprint = 7;
  // setup_source is the browser's address once a code is redeemed.
  string setup_source = 8;
  google.protobuf.Timestamp setup_started = 9;
  // setup_step is the stepper's current step (1 to 6); setup_steps is 6.
  int32 setup_step = 10;
  sneakers.appliance.osadmin.v1.SetupStepKind setup_step_kind = 11;
  int32 setup_steps = 12;
  // first_admin is set once the first admin exists.
  string first_admin = 13;
  // ssh_on: sneakers-sshd may run (an admin exists).
  bool ssh_on = 14;
  // host_keys are the SSH host keys' fingerprints.
  repeated sneakers.appliance.osadmin.v1.HostKey host_keys = 15;
  // recover is set while a Recover access code is out.
  RecoverAccess recover = 16;
  google.protobuf.Timestamp updated = 17;
  // fqdn is the box's fully qualified name once a host name or domain is
  // set; empty before. The console shows https://<fqdn>:8443 under the
  // address when it's set.
  string fqdn = 18;
  // code_locked: five wrong tries locked the setup code out; none works
  // until the console asks for a new one (ResetSetupCode).
  bool code_locked = 19;
}

// RecoverAccess is a live Recover access code.
message RecoverAccess {
  // code is XXXX-XXXX-XXXX-XXXX.
  string code = 1;
  google.protobuf.Timestamp expires = 2;
  int32 attempts_left = 3;
  // url is the page to open: https://<address>:8443/recover.
  string url = 4;
  // in_use: a browser redeemed it; source is that browser.
  bool in_use = 5;
  string source = 6;
}

message GetConsoleInfoRequest {}

message GetConsoleInfoResponse {
  ConsoleInfo console_info = 1;
}

message WatchConsoleInfoRequest {}

message WatchConsoleInfoResponse {
  ConsoleInfo console_info = 1;
}

message ResetSetupCodeRequest {}

message ResetSetupCodeResponse {
  ConsoleInfo console_info = 1;
}

message BeginRecoverAccessRequest {}

message BeginRecoverAccessResponse {
  RecoverAccess recover = 1;
}

message CancelRecoverAccessRequest {}

message CancelRecoverAccessResponse {}

message BeginRootShellRequest {
  // reason is optional, for the audit log.
  string reason = 1;
}

message BeginRootShellResponse {
  // challenge is XXXX-XXXX-XXXX-XXXX, to paste into :8443.
  string challenge = 1;
  google.protobuf.Timestamp expires = 2;
  // url is the :8443 page that answers it.
  string url = 3;
  // id names the root shell in the history.
  string id = 4;
}

message OpenRootShellRequest {
  string challenge = 1;
  // code is what :8443 answered; dashes, spaces and case don't matter.
  string code = 2;
}

message OpenRootShellResponse {
  // ticket opens rootshell.sock, once.
  string ticket = 1;
  // socket is the root-shell socket's path.
  string socket = 4;
  int32 session_minutes = 2;
  string id = 3;
}

message VerifyTotpRequest {
  string totp_code = 1;
}

message VerifyTotpResponse {
  string admin = 1;
  sneakers.appliance.osadmin.v1.Role role = 2;
  bool root_operator = 3;
  // login_id names the login in the audit log.
  string login_id = 4;
}

message EndSshLoginRequest {
  string login_id = 1;
}

message EndSshLoginResponse {}
