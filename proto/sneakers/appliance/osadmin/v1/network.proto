// The Network page. A change is staged, reviewed and committed: netd tests
// the staged gateway from the staged address, then applies and keeps it.
// SetNetwork and ConfirmNetwork are the 120-second window the page used
// before staging, and ConfirmNetwork keeps an allow-list reset.
syntax = "proto3";

package sneakers.appliance.osadmin.v1;

import "sneakers/appliance/netd/v1/netd.proto";
import "sneakers/appliance/osadmin/v1/options.proto";

option go_package = "github.com/Sneakers-PAM/sneakers-appliance/gen/go/sneakers/appliance/osadmin/v1;osadminv1";

// NetworkService reads and changes the box's network settings.
service NetworkService {
  rpc GetNetwork(GetNetworkRequest) returns (GetNetworkResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (rule) = {role: ROLE_ADMIN};
  }
  // SetNetwork applies settings with auto-revert.
  rpc SetNetwork(SetNetworkRequest) returns (SetNetworkResponse) {
    option (rule) = {
      role: ROLE_OWNER
      step_up: true
      audit: "network.set"
    };
  }
  // ConfirmNetwork keeps the pending change.
  rpc ConfirmNetwork(ConfirmNetworkRequest) returns (ConfirmNetworkResponse) {
    option (rule) = {
      role: ROLE_OWNER
      audit: "network.confirm"
    };
  }
  // StageNetwork records settings for CommitNetwork and changes nothing
  // live. A stage replaces the one before it.
  rpc StageNetwork(StageNetworkRequest) returns (StageNetworkResponse) {
    option (rule) = {
      role: ROLE_OWNER
      audit: "network.stage"
    };
  }
  // DiscardStagedNetwork drops what's staged.
  rpc DiscardStagedNetwork(DiscardStagedNetworkRequest) returns (DiscardStagedNetworkResponse) {
    option (rule) = {
      role: ROLE_OWNER
      audit: "network.discard"
    };
  }
  // CommitNetwork tests the staged gateway from the staged address, then
  // applies and saves the change, with no window. NET_GATEWAY refuses it
  // with nothing changed.
  rpc CommitNetwork(CommitNetworkRequest) returns (CommitNetworkResponse) {
    option (rule) = {
      role: ROLE_OWNER
      step_up: true
      audit: "network.commit"
    };
  }
  // RunChecks runs the link, address, gateway, DNS and NTP checks.
  rpc RunChecks(RunChecksRequest) returns (RunChecksResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (rule) = {role: ROLE_ADMIN};
  }
}

message GetNetworkRequest {}

message GetNetworkResponse {
  sneakers.appliance.netd.v1.Settings settings = 1;
  // pending is true while a change waits for ConfirmNetwork.
  bool pending = 2;
  repeated string management_addresses = 3;
  repeated string service_addresses = 4;
  bool ntp_synced = 5;
  int64 ntp_offset_ms = 6;
  // pending_token is what ConfirmNetwork takes for the pending change. Only
  // an owner's session gets it, so a reloaded page, or one opened at the
  // change's new address, can still confirm.
  string pending_token = 7;
  // pending_change_id names the pending change in the audit.
  string pending_change_id = 8;
  // revert_seconds_left is how long the pending change still waits.
  int32 revert_seconds_left = 9;
  // last_change_reverted is true when the most recent change that waited
  // for a confirmation was undone; last_change_reverted_at_start when that
  // happened because the box stopped or restarted inside its window.
  // last_change_id names it in the audit.
  bool last_change_reverted = 10;
  bool last_change_reverted_at_start = 11;
  string last_change_id = 12;
  // learnt_dns, learnt_search and learnt_ntp are what DHCP and router
  // advertisements gave the box, which the page shows next to the typed
  // values; the resolver and the clock use them where the settings name
  // none.
  repeated string learnt_dns = 13;
  repeated string learnt_search = 14;
  repeated string learnt_ntp = 15;
  // ntp_servers are the servers the clock asks now: the settings', else
  // DHCP's, else the image's default pool.
  repeated string ntp_servers = 16;
  // staged is what StageNetwork recorded, absent when nothing is staged.
  sneakers.appliance.netd.v1.Settings staged = 17;
  // staged_id is what CommitNetwork takes for it.
  string staged_id = 18;
  // staged_review says what committing it does.
  StagedReview staged_review = 19;
}

// StagedReview is what a commit of the staged settings does, shown before
// it runs: the page or shell that commits may lose the box.
message StagedReview {
  // moves_management is true when the change moves the management address,
  // so a session on the old one drops. That's expected, not an error.
  bool moves_management = 1;
  // new_address is the static management address to reconnect to; empty
  // when the address comes from DHCP or SLAAC.
  string new_address = 2;
  // new_url is the admin page at new_address.
  string new_url = 3;
  // new_certificate is true when the box makes a new self-signed :8443
  // certificate for the change.
  bool new_certificate = 4;
  // changes_allow_list is true when the change touches the allow-list,
  // which can shut out the session that commits it.
  bool changes_allow_list = 5;
}

message SetNetworkRequest {
  sneakers.appliance.netd.v1.Settings settings = 1;
}

message SetNetworkResponse {
  // token is what ConfirmNetwork takes. Empty when the change was kept at
  // once, with nothing to confirm: a change of only the DNS servers,
  // search domains, NTP servers, time zone or proxy can't cut the admin
  // off, so it has no window.
  string token = 1;
  // revert_after_seconds is the window; 0 when the change was kept at once.
  int32 revert_after_seconds = 2;
  // moves_management is true when the change moves the management
  // address: the page that applied it loses the box and has to confirm from
  // new_url.
  bool moves_management = 3;
  // new_url is the admin page at the new static management address, when
  // the change sets one.
  string new_url = 4;
  // new_certificate is true when the host name or management address
  // changes, so the box makes a new self-signed :8443 certificate (unless an
  // owner assigned one). A browser that trusted the old one asks again.
  bool new_certificate = 5;
}

message ConfirmNetworkRequest {
  string token = 1;
}

message ConfirmNetworkResponse {}

message StageNetworkRequest {
  sneakers.appliance.netd.v1.Settings settings = 1;
}

message StageNetworkResponse {
  // staged_id is what CommitNetwork takes.
  string staged_id = 1;
  StagedReview review = 2;
}

message DiscardStagedNetworkRequest {}

message DiscardStagedNetworkResponse {}

message CommitNetworkRequest {
  // staged_id is the id GetNetwork or StageNetwork gave for the change the
  // admin reviewed.
  string staged_id = 1;
}

message CommitNetworkResponse {
  // tested_gateways are the gateways that answered; empty when the change
  // set no new gateway to test.
  repeated string tested_gateways = 1;
  StagedReview review = 2;
}

message RunChecksRequest {}

message RunChecksResponse {
  repeated sneakers.appliance.netd.v1.Check checks = 1;
}
