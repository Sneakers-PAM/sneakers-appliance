// The Network page. Changes go to netd, which undoes them unless they are
// confirmed within 120 seconds from a session that still works.
syntax = "proto3";

package sneakers.appliance.osadmin.v1;

import "sneakers/appliance/netd/v1/netd.proto";
import "sneakers/appliance/osadmin/v1/options.proto";

option go_package = "github.com/Sneakers-PAM/sneakers-appliance/gen/go/sneakers/appliance/osadmin/v1;osadminv1";

// NetworkService reads and changes the box's network settings.
service NetworkService {
  rpc GetNetwork(GetNetworkRequest) returns (GetNetworkResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (rule) = {role: ROLE_ADMIN};
  }
  // SetNetwork applies settings with auto-revert.
  rpc SetNetwork(SetNetworkRequest) returns (SetNetworkResponse) {
    option (rule) = {
      role: ROLE_OWNER
      step_up: true
      audit: "network.set"
    };
  }
  // ConfirmNetwork keeps the pending change.
  rpc ConfirmNetwork(ConfirmNetworkRequest) returns (ConfirmNetworkResponse) {
    option (rule) = {
      role: ROLE_OWNER
      audit: "network.confirm"
    };
  }
  // RunChecks runs the link, address, gateway, DNS and NTP checks.
  rpc RunChecks(RunChecksRequest) returns (RunChecksResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (rule) = {role: ROLE_ADMIN};
  }
}

message GetNetworkRequest {}

message GetNetworkResponse {
  sneakers.appliance.netd.v1.Settings settings = 1;
  // pending is true while a change waits for ConfirmNetwork.
  bool pending = 2;
  repeated string management_addresses = 3;
  repeated string service_addresses = 4;
  bool ntp_synced = 5;
  int64 ntp_offset_ms = 6;
  // pending_token is what ConfirmNetwork takes for the pending change. Only
  // an owner's session gets it, so a reloaded page, or one opened at the
  // change's new address, can still confirm.
  string pending_token = 7;
  // pending_change_id names the pending change in the audit.
  string pending_change_id = 8;
  // revert_seconds_left is how long the pending change still waits.
  int32 revert_seconds_left = 9;
}

message SetNetworkRequest {
  sneakers.appliance.netd.v1.Settings settings = 1;
}

message SetNetworkResponse {
  // token is what ConfirmNetwork takes.
  string token = 1;
  int32 revert_after_seconds = 2;
  // moves_management is true when the change moves the management
  // address: the page that applied it loses the box and has to confirm from
  // new_url.
  bool moves_management = 3;
  // new_url is the admin page at the new static management address, when
  // the change sets one.
  string new_url = 4;
  // new_certificate is true when the host name or management address
  // changes, so the box makes a new self-signed :8443 certificate (unless an
  // owner assigned one). A browser that trusted the old one asks again.
  bool new_certificate = 5;
}

message ConfirmNetworkRequest {
  string token = 1;
}

message ConfirmNetworkResponse {}

message RunChecksRequest {}

message RunChecksResponse {
  repeated sneakers.appliance.netd.v1.Check checks = 1;
}
