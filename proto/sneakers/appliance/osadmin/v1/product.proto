// The installed product's exposed values: the Secret keys its bundle's
// product.yaml lets owners and admins read without the root shell, such as
// a one-time setup token.
syntax = "proto3";

package sneakers.appliance.osadmin.v1;

import "sneakers/appliance/osadmin/v1/options.proto";

option go_package = "github.com/Sneakers-PAM/sneakers-appliance/gen/go/sneakers/appliance/osadmin/v1;osadminv1";

// ProductService reads what the installed product exposes. It is a strict
// allow-list: only the values the bundle's product.yaml declares, only to
// the roles it lists, and there is no way to list or read any other Secret.
service ProductService {
  // ListExposedValues lists the values the caller's role may read (never
  // the values themselves).
  rpc ListExposedValues(ListExposedValuesRequest) returns (ListExposedValuesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (rule) = {role: ROLE_ADMIN};
  }
  // GetExposedValue reads one declared value. A name the product doesn't
  // declare, or a role it doesn't list, is refused (ACCESS_FORBIDDEN, owners
  // included); a one-time value whose consumed_when holds is consumed and
  // never shown again. Every call is audited with the name and the outcome,
  // never the value.
  rpc GetExposedValue(GetExposedValueRequest) returns (GetExposedValueResponse) {
    option (rule) = {
      role: ROLE_ADMIN
      audit: "product.value.read"
    };
  }
  // ResetProduct removes the installed product and its data: the product
  // stops in order (its phases in reverse, the database last and cleanly),
  // its k0s objects go (its stacks, its namespaces with everything in
  // them, its volume claims and volumes), k0s stops, and its data under
  // /var/lib/sneakers-data and the secrets the box made for it go. The
  // box's admins, keys, certificates, network settings, Base OS and Base
  // Web slots and the OS audit log stay. The installed bundle stays on the
  // box as the staged one, so Apply on the Product card installs it again
  // with a new setup token. The closed shell's "<product> reset" only, by
  // an owner, with a new authenticator code and the product's name or the
  // box's host name typed to confirm (docs/upgrades.md#removing-the-product).
  rpc ResetProduct(ResetProductRequest) returns (ResetProductResponse) {
    option (rule) = {
      role: ROLE_OWNER
      code_each_call: true
      ssh_only: true
      audit: "product.reset"
    };
  }
}

// ExposedValue describes one declared value.
message ExposedValue {
  // name is the command word: "<product> <name>" in the closed shell.
  string name = 1;
  string label = 2;
  bool one_time = 3;
  // consumed is true once a one-time value was used; it isn't shown again.
  bool consumed = 4;
  repeated Role roles = 5;
  // link is the product page that takes the value, with the box's host in
  // it; empty when the product names none.
  string link = 6;
}

message ListExposedValuesRequest {}

message ListExposedValuesResponse {
  // product is the installed product's command word and product_title its
  // name for people; both empty with no product installed.
  string product = 1;
  string product_title = 2;
  repeated ExposedValue values = 3;
}

message GetExposedValueRequest {
  string name = 1;
}

message GetExposedValueResponse {
  string product_title = 1;
  ExposedValue entry = 2;
  // value is empty once a one-time value was consumed.
  string value = 3;
}

message ResetProductRequest {
  // totp_code is a new code from the owner's authenticator, on top of the
  // one the login took.
  string totp_code = 1;
  // confirm is the installed product's name or the box's host name, as
  // typed.
  string confirm = 2;
}

message ResetProductResponse {
  // product is the removed product's command word, product_title its name
  // for people and version its version.
  string product = 1;
  string product_title = 2;
  string version = 3;
  // namespaces and objects are the product's namespaces and the k0s
  // objects removed (the namespaces' objects, the stacks' cluster-wide
  // objects and the volumes), and bytes_removed what the removed data and
  // slot files held.
  uint32 namespaces = 4;
  uint32 objects = 5;
  uint64 bytes_removed = 6;
  // staged_version is the bundle kept as the staged one, which Apply
  // installs again.
  string staged_version = 7;
}
