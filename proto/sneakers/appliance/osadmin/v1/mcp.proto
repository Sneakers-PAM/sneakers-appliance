// The MCP page.
syntax = "proto3";

package sneakers.appliance.osadmin.v1;

import "sneakers/appliance/osadmin/v1/options.proto";

option go_package = "github.com/Sneakers-PAM/sneakers-appliance/gen/go/sneakers/appliance/osadmin/v1;osadminv1";

// McpService switches the product's MCP and machine API.
service McpService {
  rpc GetMcp(GetMcpRequest) returns (GetMcpResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (rule) = {role: ROLE_ADMIN};
  }
  rpc SetMcp(SetMcpRequest) returns (SetMcpResponse) {
    option (rule) = {
      role: ROLE_ADMIN
      step_up: true
      audit: "mcp.set"
    };
  }
}

message GetMcpRequest {}

message GetMcpResponse {
  bool mcp_enabled = 1;
  bool machine_api_enabled = 2;
  // state is the MCP switch as set: on, off, not installed or not in this
  // product.
  string state = 3;
  // readiness is how far the product has come up with the switch on:
  // starting (it rolls out), ready, or failed (it wasn't ready within the
  // bound of the last switch-on); empty while the switch is off.
  string readiness = 4;
  // detail is what a starting or failed MCP waits for, in words.
  string detail = 5;
}

message SetMcpRequest {
  bool mcp_enabled = 1;
  bool machine_api_enabled = 2;
}

message SetMcpResponse {}
