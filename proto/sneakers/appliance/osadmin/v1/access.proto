// The Access page: admins, roles, passwords and authenticators, the SSH
// keys the box issues, the lockout, the root-shell settings, the host keys
// and the root-operator roster (the same roster approves a factory reset).
syntax = "proto3";

package sneakers.appliance.osadmin.v1;

import "google/protobuf/timestamp.proto";
import "sneakers/appliance/osadmin/v1/options.proto";
import "sneakers/appliance/osadmin/v1/setup.proto";

option go_package = "github.com/Sneakers-PAM/sneakers-appliance/gen/go/sneakers/appliance/osadmin/v1;osadminv1";

// AccessService manages who may sign in. An admin manages their own
// password, authenticator and SSH keys; owners manage everyone.
service AccessService {
  rpc ListAdmins(ListAdminsRequest) returns (ListAdminsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (rule) = {role: ROLE_ADMIN};
  }
  // AddAdmin adds an admin with no password yet and returns a one-time
  // invitation code (24 hours) the new admin redeems on :8443 to set a
  // password and an authenticator.
  rpc AddAdmin(AddAdminRequest) returns (AddAdminResponse) {
    option (rule) = {
      role: ROLE_OWNER
      step_up: true
      audit: "access.admin.add"
    };
  }
  // RemoveAdmin ends every session of the admin.
  rpc RemoveAdmin(RemoveAdminRequest) returns (RemoveAdminResponse) {
    option (rule) = {
      role: ROLE_OWNER
      step_up: true
      audit: "access.admin.remove"
    };
  }
  rpc SetRole(SetRoleRequest) returns (SetRoleResponse) {
    option (rule) = {
      role: ROLE_OWNER
      step_up: true
      audit: "access.admin.role"
    };
  }
  // AddKey is no longer served: the box issues SSH keys (IssueSshKey) and
  // never takes one an admin brings. It answers Not available.
  rpc AddKey(AddKeyRequest) returns (AddKeyResponse) {
    option deprecated = true;
    option (rule) = {
      role: ROLE_ADMIN
      step_up: true
      audit: "access.key.add"
    };
  }
  // RemoveKey revokes an issued SSH key: its certificate serial joins the
  // revocation list at once. An admin only their own keys.
  rpc RemoveKey(RemoveKeyRequest) returns (RemoveKeyResponse) {
    option (rule) = {
      role: ROLE_ADMIN
      step_up: true
      audit: "access.key.remove"
    };
  }
  // UnrevokeKey takes a removed login key off sshd's revocation list, so it
  // can be added to an admin again.
  rpc UnrevokeKey(UnrevokeKeyRequest) returns (UnrevokeKeyResponse) {
    option (rule) = {
      role: ROLE_OWNER
      step_up: true
      audit: "access.key.unrevoke"
    };
  }
  // SetElevationPolicy is no longer served: SetAccessPolicy holds the
  // root-shell settings. It answers Not available.
  rpc SetElevationPolicy(SetElevationPolicyRequest) returns (SetElevationPolicyResponse) {
    option deprecated = true;
    option (rule) = {
      role: ROLE_OWNER
      step_up: true
      audit: "access.elevation-policy.set"
    };
  }
  // SetQuorum sets the root-operator roster (N members): they may open the
  // root shell, and M of them must approve a factory reset. The roster is
  // never empty.
  rpc SetQuorum(SetQuorumRequest) returns (SetQuorumResponse) {
    option (rule) = {
      role: ROLE_OWNER
      step_up: true
      audit: "access.quorum.set"
    };
  }
  // IssueSshKey has the box make an ed25519 key pair for the caller and
  // sign it with the box's root key as an SSH user certificate (principal:
  // the admin's name; valid for valid_days, default from the access
  // policy). The private key is returned once and never kept; the box
  // keeps the public key and the certificate. It takes a fresh TOTP code
  // every time (code_each_call), not the step-up window, since the private
  // key leaves the box. TOTP is still asked at every SSH login.
  rpc IssueSshKey(IssueSshKeyRequest) returns (IssueSshKeyResponse) {
    option (rule) = {
      role: ROLE_ADMIN
      code_each_call: true
      audit: "access.ssh-key.issue"
    };
  }
  // ChangePassword sets the caller's new password; the current one is
  // checked first.
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse) {
    option (rule) = {
      role: ROLE_ADMIN
      step_up: true
      audit: "access.password.change"
    };
  }
  // BeginTotpReplacement returns a new TOTP secret for the caller;
  // nothing changes until CompleteTotpReplacement checks a code from it.
  rpc BeginTotpReplacement(BeginTotpReplacementRequest) returns (BeginTotpReplacementResponse) {
    option (rule) = {
      role: ROLE_ADMIN
      step_up: true
      audit: "access.totp.begin"
    };
  }
  rpc CompleteTotpReplacement(CompleteTotpReplacementRequest) returns (CompleteTotpReplacementResponse) {
    option (rule) = {
      role: ROLE_ADMIN
      step_up: true
      audit: "access.totp.replace"
    };
  }
  // ReinviteAdmin clears an admin's password and authenticator, ends their
  // sessions and returns a new invitation code. Owners only, never for
  // themselves.
  rpc ReinviteAdmin(ReinviteAdminRequest) returns (ReinviteAdminResponse) {
    option (rule) = {
      role: ROLE_OWNER
      step_up: true
      audit: "access.admin.reinvite"
    };
  }
  // UnlockAdmin ends an admin's lockout.
  rpc UnlockAdmin(UnlockAdminRequest) returns (UnlockAdminResponse) {
    option (rule) = {
      role: ROLE_OWNER
      step_up: true
      audit: "access.admin.unlock"
    };
  }
  // SetAccessPolicy sets the lockout mode, the root-shell code and session
  // lifetimes and the default SSH key validity.
  rpc SetAccessPolicy(SetAccessPolicyRequest) returns (SetAccessPolicyResponse) {
    option (rule) = {
      role: ROLE_OWNER
      step_up: true
      audit: "access.policy.set"
    };
  }
}

// Key is an SSH key the box issued to an admin.
message Key {
  string fingerprint = 1;
  string type = 2;
  // comment is the label the admin gave it.
  string comment = 3;
  google.protobuf.Timestamp added = 4;
  string added_by = 5;
  // via is issued for a key the box made.
  string via = 6;
  google.protobuf.Timestamp last_used = 7;
  // serial is the certificate's serial, the one revocation lists.
  uint64 serial = 8;
  // valid_before is when the certificate stops working.
  google.protobuf.Timestamp valid_before = 9;
}

message Admin {
  string name = 1;
  int32 uid = 2;
  Role role = 3;
  google.protobuf.Timestamp created = 4;
  string created_by = 5;
  repeated Key keys = 6;
  // approval_hold_until is unused: elevation approval is gone.
  google.protobuf.Timestamp approval_hold_until = 7 [deprecated = true];
  // credentials_set is false while an invitation is open: the admin has no
  // password and authenticator yet and can't sign in.
  bool credentials_set = 8;
  google.protobuf.Timestamp password_changed = 9;
  google.protobuf.Timestamp totp_added = 10;
  // root_operator: on the root-operator roster.
  bool root_operator = 11;
  // locked_until is when a timed lockout ends; locked_until_unlocked
  // marks a lockout only an owner ends.
  google.protobuf.Timestamp locked_until = 12;
  bool locked_until_unlocked = 13;
  // failed_attempts counts the consecutive failures in the current
  // 15-minute window.
  int32 failed_attempts = 14;
  // invite_expires is when an open invitation's code stops working.
  google.protobuf.Timestamp invite_expires = 15;
  google.protobuf.Timestamp last_sign_in = 16;
}

// RevokedKey is a removed login key, on sshd's revocation list until an
// owner un-revokes it.
message RevokedKey {
  string fingerprint = 1;
  string type = 2;
  // admin is who the key belonged to.
  string admin = 3;
  google.protobuf.Timestamp revoked = 4;
  // revoked_by is who removed the key or its admin: an admin's name, or
  // "console". "unknown" for a key revoked before this was recorded.
  string revoked_by = 5;
}

message HostKey {
  string type = 1;
  string fingerprint = 2;
}

// ElevationPolicy belonged to the removed owner-approved elevation.
message ElevationPolicy {
  option deprecated = true;
  int32 max_minutes = 1;
  int32 default_minutes = 2;
  bool self_approval_when_single_owner = 3;
}

// Quorum is the root-operator roster: who may open the root shell, and
// whose approvals count for a factory reset.
message Quorum {
  // members are the root operators (N = len(members)).
  repeated string members = 1;
  // required is M, the approvals a factory reset needs.
  int32 required = 2;
  // configured is false only on a box set up before the roster was
  // recorded at the first admin.
  bool configured = 3;
}

// LockoutMode is what happens after 3 consecutive failures within 15
// minutes (NIST SP 800-53 AC-7).
enum LockoutMode {
  LOCKOUT_MODE_UNSPECIFIED = 0;
  // LOCKOUT_MODE_TIMED: locked for 15 minutes (the default).
  LOCKOUT_MODE_TIMED = 1;
  // LOCKOUT_MODE_UNTIL_UNLOCKED: locked until an owner unlocks it.
  LOCKOUT_MODE_UNTIL_UNLOCKED = 2;
}

// AccessPolicy is the box's access settings.
message AccessPolicy {
  LockoutMode lockout_mode = 1;
  // root_code_minutes is how long a root-shell code works (1 to 60,
  // default 10).
  int32 root_code_minutes = 2;
  // root_session_minutes is the longest a root shell stays open (1 to 60,
  // default 10).
  int32 root_session_minutes = 3;
  // ssh_key_valid_days is an issued SSH key's default validity (1 to
  // 1825, default 365).
  int32 ssh_key_valid_days = 4;
}

message ListAdminsRequest {}

message ListAdminsResponse {
  repeated Admin admins = 1;
  repeated HostKey host_keys = 2;
  ElevationPolicy elevation_policy = 3 [deprecated = true];
  Quorum quorum = 4;
  repeated RevokedKey revoked_keys = 5;
  AccessPolicy access_policy = 6;
  // root_key is the box's root key: its type and SHA256: fingerprint
  // (the key itself never leaves the box).
  HostKey root_key = 7;
  // user_ca_public_key is the root key's public half, the user CA sshd
  // trusts (an authorized_keys line).
  string user_ca_public_key = 8;
  // host_ca is the box's SSH host CA: its type and fingerprint.
  HostKey host_ca = 9;
  // known_hosts is the "@cert-authority <names> <host CA key>" line for
  // a client's known_hosts, as IssueSshKey gives it.
  string known_hosts = 10;
}

message AddAdminRequest {
  string name = 1;
  Role role = 2;
  // public_key is unused: the box issues SSH keys.
  string public_key = 3 [deprecated = true];
  // root_operator puts the new admin on the root-operator roster.
  bool root_operator = 4;
}

// Invitation is a one-time code for an admin to set a password and an
// authenticator on :8443. Shown once.
message Invitation {
  string admin = 1;
  // code is XXXX-XXXX-XXXX-XXXX.
  string code = 2;
  google.protobuf.Timestamp expires = 3;
}

message AddAdminResponse {
  Admin admin = 1;
  Invitation invitation = 2;
}

message RemoveAdminRequest {
  string name = 1;
}

message RemoveAdminResponse {}

message SetRoleRequest {
  string name = 1;
  Role role = 2;
}

message SetRoleResponse {}

message AddKeyRequest {
  option deprecated = true;
  string admin = 1;
  string public_key = 2;
}

message AddKeyResponse {
  option deprecated = true;
  Key key = 1;
}

message RemoveKeyRequest {
  string admin = 1;
  string fingerprint = 2;
}

message RemoveKeyResponse {}

message UnrevokeKeyRequest {
  string fingerprint = 1;
}

message UnrevokeKeyResponse {}

message SetElevationPolicyRequest {
  option deprecated = true;
  ElevationPolicy policy = 1;
}

message SetElevationPolicyResponse {
  option deprecated = true;
}

message SetQuorumRequest {
  repeated string members = 1;
  int32 required = 2;
}

message SetQuorumResponse {}

message IssueSshKeyRequest {
  // label names the key on the Access page (a laptop, say).
  string label = 1;
  // valid_days is 0 for the access policy's default.
  int32 valid_days = 2;
  // totp_code is a fresh code from the caller's authenticator.
  string totp_code = 3;
}

message IssueSshKeyResponse {
  Key key = 1;
  // private_key is the OpenSSH private key, shown once.
  string private_key = 2;
  // certificate is the OpenSSH certificate line, to save next to the key
  // as certificate_file_name.
  string certificate = 3;
  // public_key is the OpenSSH public key line.
  string public_key = 4;
  // file_name is the name for the private key file, unique to this key
  // (it carries the serial), so a browser never renames a repeated
  // download and the pair always matches.
  string file_name = 5;
  // certificate_file_name is <file_name>-cert.pub: OpenSSH loads the
  // certificate on its own only from this name next to the key.
  string certificate_file_name = 6;
  // ppk is the same key as a PuTTY private key file (format 3, PuTTY 0.78
  // or later) with the certificate embedded, for PuTTY and MobaXterm.
  // Shown once, like private_key.
  string ppk = 7;
  // ppk_file_name is <file_name>.ppk.
  string ppk_file_name = 8;
  // ssh_command is the OpenSSH command for this key and box:
  // ssh -i <file_name> -o CertificateFile=<certificate_file_name> <admin>@<box>.
  string ssh_command = 9;
  // public_key_file_name is <file_name>.pub, for public_key; the same
  // public key goes with all three forms.
  string public_key_file_name = 10;
  // pem is the same private key as PEM PKCS#8 ("PRIVATE KEY"), for tools
  // that take neither the OpenSSH nor the PuTTY form; it carries no
  // certificate, so it pairs with certificate_file_name. Shown once.
  string pem = 11;
  // pem_file_name is <file_name>.pem.
  string pem_file_name = 12;
  // user_ca_public_key is the box's user CA (its root key's public half),
  // which signed the certificate; for reference.
  string user_ca_public_key = 13;
  // known_hosts is a line for the client's known_hosts that trusts the
  // box's host CA for its host name and management addresses:
  // "@cert-authority <names> <host CA key>". sshd presents a host
  // certificate that CA signed, so the first login has no host key prompt.
  string known_hosts = 14;
  // known_hosts_file_name is known_hosts_<box>, for known_hosts.
  string known_hosts_file_name = 15;
}

message ChangePasswordRequest {
  string current_password = 1;
  string new_password = 2;
}

message ChangePasswordResponse {}

message BeginTotpReplacementRequest {}

message BeginTotpReplacementResponse {
  TotpEnrolment totp = 1;
}

message CompleteTotpReplacementRequest {
  string enrolment_id = 1;
  string totp_code = 2;
}

message CompleteTotpReplacementResponse {}

message ReinviteAdminRequest {
  string name = 1;
}

message ReinviteAdminResponse {
  Invitation invitation = 1;
}

message UnlockAdminRequest {
  string name = 1;
}

message UnlockAdminResponse {}

message SetAccessPolicyRequest {
  AccessPolicy policy = 1;
}

message SetAccessPolicyResponse {}
