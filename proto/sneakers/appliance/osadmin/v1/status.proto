// The Status page (home).
syntax = "proto3";

package sneakers.appliance.osadmin.v1;

import "google/protobuf/timestamp.proto";
import "sneakers/appliance/osadmin/v1/options.proto";
import "sneakers/appliance/osadmin/v1/power.proto";
import "sneakers/appliance/osadmin/v1/upgrade.proto";

option go_package = "github.com/Sneakers-PAM/sneakers-appliance/gen/go/sneakers/appliance/osadmin/v1;osadminv1";

// StatusService is the box at a glance.
service StatusService {
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (rule) = {role: ROLE_ADMIN};
  }
  // SetSecureBoot turns the Secure Boot setting off, or on again without a
  // reinstall. The typed confirmation is the box's host name.
  rpc SetSecureBoot(SetSecureBootRequest) returns (SetSecureBootResponse) {
    option (rule) = {
      role: ROLE_OWNER
      step_up: true
      audit: "status.secure-boot.set"
    };
  }
  // GetPhase says whether the box is still in setup (firstboot) or set up
  // (normal), and what the box is doing for the product edge's box-state
  // page. It is public: the pages read it before anyone signs in,
  // sneakers-osadmin sends every page but /setup to /setup while setup is
  // open, and sneakers-edgefall serves the state on 443. It says nothing
  // else about the box.
  rpc GetPhase(GetPhaseRequest) returns (GetPhaseResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (rule) = {public: true};
  }
}

message GetPhaseRequest {}

message GetPhaseResponse {
  // phase is firstboot until setup's Finish, then normal.
  string phase = 1;
  // state is what the box is doing, as the product edge's box-state page
  // shows it: running (the product runs), starting (it doesn't run yet,
  // or setup isn't done), rebooting, shutting-down (init has announced
  // the reboot or the power-off), updating (an update is being applied or
  // reverted) or maintenance.
  string state = 2;
  // product_running: the product's service (k0s) runs, so its edge holds
  // 80 and 443; while it doesn't, sneakers-edgefall answers there.
  bool product_running = 3;
  // product_installed: a product bundle is installed. Before one is,
  // nothing answers 80 or 443.
  bool product_installed = 4;
  // upgrade_progress is an update's steps while one is in progress or
  // just ended, for the restart page before anyone signs in again: the
  // steps' ids, labels and states only, with no version, detail or code.
  UpgradeProgress upgrade_progress = 5;
}

message GetStatusRequest {}

// Protection is the at-rest protection level.
enum Protection {
  PROTECTION_UNSPECIFIED = 0;
  PROTECTION_FULL = 1;
  PROTECTION_REDUCED = 2;
}

// WarningKind is one of the Status warnings.
enum WarningKind {
  WARNING_KIND_UNSPECIFIED = 0;
  // WARNING_KIND_EXPOSURE: a public management address and a wide
  // allow-list.
  WARNING_KIND_EXPOSURE = 1;
  WARNING_KIND_REDUCED_PROTECTION = 2;
  WARNING_KIND_SELF_SIGNED_TLS = 3;
  WARNING_KIND_NTP_UNSYNCED = 4;
  // WARNING_KIND_CONSOLE_RECOVERY: a key was added through the console's
  // Recover access and is still under its 24-hour hold.
  WARNING_KIND_CONSOLE_RECOVERY = 5;
  WARNING_KIND_FACTORY_RESET = 6;
  // WARNING_KIND_SELF_APPROVED_ELEVATION: the only owner approved their
  // own elevation, and it is approved or active.
  WARNING_KIND_SELF_APPROVED_ELEVATION = 7;
  // WARNING_KIND_TLS_EXPIRING: an endpoint's assigned certificate expires
  // in 30, 14 or 7 days or fewer (nothing renews it).
  WARNING_KIND_TLS_EXPIRING = 8;
  WARNING_KIND_TLS_EXPIRED = 9;
  // WARNING_KIND_TLS_NAMES: an endpoint's certificate no longer covers any
  // of the names it answers on.
  WARNING_KIND_TLS_NAMES = 10;
}

message Warning {
  WarningKind kind = 1;
  // detail is one plain sentence.
  string detail = 2;
}

// Component is one OS-layer service osadmin talks to.
message Component {
  string name = 1;
  bool ok = 2;
  string detail = 3;
}

message Disk {
  // path is the state volume's mount point.
  string path = 1;
  uint64 used_bytes = 2;
  uint64 total_bytes = 3;
  // growth_bytes_per_day is the average daily growth over the last week of
  // daily samples; 0 until two days are sampled.
  int64 growth_bytes_per_day = 4;
}

message GetStatusResponse {
  string version = 1;
  string channel = 2;
  string hostname = 3;
  // phase is firstboot or normal.
  string phase = 4;
  string running_version = 5;
  string staged_version = 6;
  // failed_version is a release boot counting fell back from: it never
  // reached MarkGood. Empty after a manual revert.
  string failed_version = 7;
  Protection protection = 8;
  // protection_reason is empty for full, else no-secure-boot-firmware,
  // secure-boot-off or no-tpm.
  string protection_reason = 9;
  // custody_mode is tpm or keyfile.
  string custody_mode = 10;
  repeated string management_addresses = 11;
  bool ntp_synced = 12;
  Disk disk = 13;
  repeated Component health = 14;
  // tls_fingerprint is the SHA-256 of :8443's own certificate.
  string tls_fingerprint = 15;
  google.protobuf.Timestamp tls_expires = 16;
  bool tls_self_signed = 17;
  repeated Warning warnings = 18;
  // factory_reset is set while one is pending or counting down.
  FactoryReset factory_reset = 19;
  // reverted_version is the newer release an admin reverted from, with who
  // did it and when; empty when there was no manual revert.
  string reverted_version = 20;
  string reverted_by = 21;
  google.protobuf.Timestamp reverted_at = 22;
  // previous_version is the older release kept in the other slot for a
  // revert, and previous_slot that slot, A or B (empty when the box can't
  // tell which slot it runs from). Both are empty when there's no release
  // to revert to.
  string previous_version = 23;
  string previous_slot = 24;
  // upgrade_progress is the last stage, apply or revert, step by step;
  // unset when the box has made none.
  UpgradeProgress upgrade_progress = 25;
}

message SetSecureBootRequest {
  bool on = 1;
  string confirm_hostname = 2;
}

message SetSecureBootResponse {}
