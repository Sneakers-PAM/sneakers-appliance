// The Import page (docs/import.md): an export of an earlier install comes
// into the installed product before its own first-run setup. The files go
// up with POST /import/upload?kind=<bundle|mapping|sheet|types>.
syntax = "proto3";

package sneakers.appliance.osadmin.v1;

import "sneakers/appliance/osadmin/v1/options.proto";

option go_package = "github.com/Sneakers-PAM/sneakers-appliance/gen/go/sneakers/appliance/osadmin/v1;osadminv1";

// ImportService opens an import, runs its steps and closes it.
service ImportService {
  rpc GetImport(GetImportRequest) returns (GetImportResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (rule) = {role: ROLE_ADMIN};
  }
  // OpenImport turns the import switch on and makes the import key on the
  // box, once. Refused once the product's own setup is done, unless the
  // box was imported (a re-import).
  rpc OpenImport(OpenImportRequest) returns (OpenImportResponse) {
    option (rule) = {
      role: ROLE_ADMIN
      step_up: true
      audit: "import.open"
    };
  }
  // RunImportStep starts one sneakers-migrate step as a Job.
  rpc RunImportStep(RunImportStepRequest) returns (RunImportStepResponse) {
    option (rule) = {
      role: ROLE_ADMIN
      step_up: true
      audit: "import.run"
    };
  }
  // TakeOwnerPassword shows the first admin's one-time password an import
  // step made, once.
  rpc TakeOwnerPassword(TakeOwnerPasswordRequest) returns (TakeOwnerPasswordResponse) {
    option (rule) = {
      role: ROLE_ADMIN
      step_up: true
      audit: "import.owner-password"
    };
  }
  // CloseImport turns the import switch off and removes the export, its
  // key and the outputs.
  rpc CloseImport(CloseImportRequest) returns (CloseImportResponse) {
    option (rule) = {
      role: ROLE_ADMIN
      step_up: true
      audit: "import.close"
    };
  }
}

message GetImportRequest {}

message ImportFile {
  // kind is bundle, mapping, sheet or types.
  string kind = 1;
  int64 size = 2;
  string uploaded_at = 3;
}

message ImportRun {
  string job = 1;
  // step is review, convert, check, import or verify.
  string step = 2;
  // state is running, passed or failed.
  string state = 3;
  int32 exit_code = 4;
  string started_at = 5;
  string finished_at = 6;
  // output is what the step printed (its last 256 KiB); never a value.
  string output = 7;
  // report is the step's JSON report (import, verify, review), if any.
  string report = 8;
  // template is review's keep-everything mapping file, if any.
  string template = 9;
  // owner_password_waiting: an import made a one-time password not yet
  // shown (TakeOwnerPassword).
  bool owner_password_waiting = 10;
  bool rehearsal = 11;
  bool wipe = 12;
  string owner_email = 13;
}

message GetImportResponse {
  // available: the installed product takes an import.
  bool available = 1;
  string label = 2;
  // open: an import is open (its switch on, its key made).
  bool open = 3;
  // recipient is the open import's key, which the export is encrypted to.
  string recipient = 4;
  repeated ImportFile files = 5;
  repeated ImportRun runs = 6;
  // setup_done: the product's own first-run setup is done, so no import
  // opens (unless imported).
  bool setup_done = 7;
  // imported: the product's users and data came from an import; the box
  // is in imported-users mode and the product's own setup is skipped.
  bool imported = 8;
  string imported_bundle = 9;
  string imported_at = 10;
  string imported_mode = 11;
  // reason says why the page can't open an import, when it can't.
  string reason = 12;
}

message OpenImportRequest {}

message OpenImportResponse {
  string recipient = 1;
}

message RunImportStepRequest {
  // step is review, convert, check, import or verify.
  string step = 1;
  bool rehearsal = 2;
  bool wipe = 3;
  string owner_email = 4;
  string new_folder_parent = 5;
  string personal = 6;
}

message RunImportStepResponse {
  string job = 1;
}

message TakeOwnerPasswordRequest {
  string job = 1;
}

message TakeOwnerPasswordResponse {
  string password = 1;
}

message CloseImportRequest {}

message CloseImportResponse {}
