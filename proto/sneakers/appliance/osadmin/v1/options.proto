// The :8443 appliance admin API of sneakers-osadmin, served with Connect
// (gRPC, gRPC-Web and JSON over HTTP) next to the static admin pages. Every
// method carries a Rule: the least role that may call it, whether it needs
// a step-up, and the OS audit action it writes. osadmin enforces the rule
// from this descriptor, so the proto is the one place it is declared.
syntax = "proto3";

package sneakers.appliance.osadmin.v1;

import "google/protobuf/descriptor.proto";

option go_package = "github.com/Sneakers-PAM/sneakers-appliance/gen/go/sneakers/appliance/osadmin/v1;osadminv1";

// Role is an appliance admin's role. Root operators are not a third role
// but a roster any admin may be on (Admin.root_operator): they may open the
// root shell, and they approve a factory reset.
enum Role {
  ROLE_UNSPECIFIED = 0;
  // ROLE_ADMIN can use every page except managing other admins and the
  // box's access settings.
  ROLE_ADMIN = 1;
  // ROLE_OWNER can do everything.
  ROLE_OWNER = 2;
}

// Rule guards one method.
message Rule {
  // public methods need no session (the sign-in methods and redeeming a
  // one-time code only).
  bool public = 1;
  // role is the least role that may call the method.
  Role role = 2;
  // step_up: the session's sign-in or its last step-up (a fresh TOTP code,
  // SignInService.StepUp) must be no older than 5 minutes
  // (ACCESS_STEPUP_REQUIRED).
  bool step_up = 3;
  // audit is the OS audit action written for every call, allowed or
  // refused. Empty for reads.
  string audit = 4;
  // code_session: the method also takes the session a redeemed one-time
  // code gives (the first-boot setup code, an admin's invitation or the
  // console's Recover access code), before that admin can sign in. When
  // role is also set, a signed-in admin of that role may call it too.
  bool code_session = 5;
  // setup_only methods are refused with SETUP_DONE once setup is done.
  // Every call made with a setup code's session is refused the same way,
  // whatever its method.
  bool setup_only = 6;
  // code_each_call: the request's totp_code must be a fresh code from the
  // caller's authenticator on every call, whatever the step-up window
  // says. A wrong or reused code counts toward the sign-in lockout. Used
  // for the actions that reboot the box or swap what it runs.
  bool code_each_call = 7;
  // ssh_only methods are a closed-shell login's alone, which
  // sneakers-accessd runs as that admin: a call from :8443 or the console
  // is refused (ACCESS_FORBIDDEN) and audited, whatever the role. With
  // code_each_call the request's totp_code is checked for the login too,
  // on top of the code it signed in with.
  bool ssh_only = 8;
}

extend google.protobuf.MethodOptions {
  Rule rule = 51000;
}
