// The Updates page. A .bin is uploaded with POST /upload (the session
// cookie and the X-CSRF-Token header, the file as the body), which answers
// {"uploadId": "..."}; or fetched from the configured mirror, then the
// release source. Either way its signature, channel and hash are verified
// before anything is unpacked.
//
// The same flow carries both targets: the base image (the OS, its slots
// and a reboot) and the product bundle (k0s, its images and the product,
// in their own slots on the state volume, with no reboot). The first
// product install is the same flow with no previous slot.
syntax = "proto3";

package sneakers.appliance.osadmin.v1;

import "google/protobuf/timestamp.proto";
import "sneakers/appliance/osadmin/v1/elevation.proto";
import "sneakers/appliance/osadmin/v1/options.proto";

option go_package = "github.com/Sneakers-PAM/sneakers-appliance/gen/go/sneakers/appliance/osadmin/v1;osadminv1";

// UpgradeService verifies, stages, applies and reverts releases.
service UpgradeService {
  rpc GetUpgrades(GetUpgradesRequest) returns (GetUpgradesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (rule) = {role: ROLE_ADMIN};
  }
  // FetchUpdate downloads a .bin, a base update or a product bundle, from
  // the mirror, then the release source when the policy allows direct
  // fetches. Refused when neither is set (air-gap: upload only).
  rpc FetchUpdate(FetchUpdateRequest) returns (FetchUpdateResponse) {
    option (rule) = {
      role: ROLE_ADMIN
      audit: "upgrade.fetch"
    };
  }
  // StageUpdate verifies an uploaded or fetched .bin, then decrypts,
  // unpacks and stages it into the inactive slot: the base image's, or for
  // a product bundle, which must fit the running base, the product's.
  rpc StageUpdate(StageUpdateRequest) returns (StageUpdateResponse) {
    option (rule) = {
      role: ROLE_OWNER
      audit: "upgrade.stage"
    };
  }
  // ApplyUpdate boots the staged release, or for target product switches
  // to the staged product slot and restarts the product services (no
  // reboot). It takes a fresh TOTP code every time (code_each_call), not
  // the step-up window. While an elevated shell is open
  // it is refused with UPGRADE_ELEVATED, unless the request carries an
  // owner's elevation_override for that shell.
  rpc ApplyUpdate(ApplyUpdateRequest) returns (ApplyUpdateResponse) {
    option (rule) = {
      role: ROLE_OWNER
      code_each_call: true
      audit: "upgrade.apply"
    };
  }
  // RevertUpdate goes back to the previous release, or for target product
  // to the previous product slot. Like ApplyUpdate it takes a fresh TOTP
  // code every time, and an open elevated shell holds it back the same way.
  rpc RevertUpdate(RevertUpdateRequest) returns (RevertUpdateResponse) {
    option (rule) = {
      role: ROLE_OWNER
      code_each_call: true
      audit: "upgrade.revert"
    };
  }
  // DiscardUpdate drops a held upload or fetched file by id (its .bin,
  // any partial .tmp and unpacked layout), or, with no id, unstages the
  // staged release of target: the base release's boot entry, or the
  // product's staged slot. It is refused with UPGRADE_BUSY while a stage
  // is under way, and audited.
  rpc DiscardUpdate(DiscardUpdateRequest) returns (DiscardUpdateResponse) {
    option (rule) = {
      role: ROLE_OWNER
      audit: "upgrade.discard"
    };
  }
  // ListProductVersions lists the product bundles this box may install:
  // stable versions for its architecture and channel that fit the running
  // base, newer than the installed product. It reads the index from the
  // mirror, then the release source when the policy allows direct
  // fetches; refused with UPGRADE_AIR_GAPPED when neither is set.
  rpc ListProductVersions(ListProductVersionsRequest) returns (ListProductVersionsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (rule) = {role: ROLE_ADMIN};
  }
  // ListBaseVersions lists the base releases this box may stage from the
  // index's base section (the mirror, then the release source when the
  // policy allows direct fetches): full or patch for its architecture and
  // channel, stable on a production box, newer than the running base, a
  // patch only for the base it names. The index is only a menu: the chosen
  // .bin goes through FetchUpdate and is verified when it's staged.
  rpc ListBaseVersions(ListBaseVersionsRequest) returns (ListBaseVersionsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (rule) = {role: ROLE_ADMIN};
  }
  rpc SetUpgradePolicy(SetUpgradePolicyRequest) returns (SetUpgradePolicyResponse) {
    option (rule) = {
      role: ROLE_OWNER
      audit: "upgrade.policy.set"
    };
  }
}

// UpgradePolicy is when updates apply and where they come from.
message UpgradePolicy {
  // mode is automatic (in the window) or manual.
  string mode = 1;
  // window_start is HH:MM local; window_minutes its length.
  string window_start = 2;
  int32 window_minutes = 3;
  // mirror_url is the internal source the .bin files and the product
  // index are fetched from: an http:// or https:// base with no
  // credentials. Every .bin is verified by its signature whichever it is.
  // An https:// mirror is checked against the system roots plus the
  // update trust (TlsService.SetUpdateTrust). Empty, with direct off,
  // means air-gapped: the box never fetches.
  string mirror_url = 4;
  // direct fetches from the release source (the GitHub Release) when no
  // mirror is set or the mirror fails. Off by default.
  bool direct = 5;
}

// UpdateTarget is what an update changes. Unspecified is the base image,
// as before product bundles.
enum UpdateTarget {
  UPDATE_TARGET_UNSPECIFIED = 0;
  // UPDATE_TARGET_BASE is the base image: the OS slots and a reboot.
  UPDATE_TARGET_BASE = 1;
  // UPDATE_TARGET_PRODUCT is the product bundle: k0s, its images and the
  // product, in their own slots on the state volume.
  UPDATE_TARGET_PRODUCT = 2;
}

// ProductSlots are the product bundle's slots on the state volume.
message ProductSlots {
  // installed_version is the product running from the current slot; empty
  // before the first install.
  string installed_version = 1;
  string staged_version = 2;
  // previous_version is the slot a revert goes back to; empty when there
  // is none.
  string previous_version = 3;
  // running is true while the product services (k0s) run.
  bool running = 4;
  // name is the installed product's name for people, such as "Sneakers",
  // from the current slot's header; empty before the first install. The
  // :8443 nav shows the product's own section under it, and only while it
  // is set.
  string name = 5;
}

// ProductVersion is one product bundle a source offers.
message ProductVersion {
  string version = 1;
  string arch = 2;
  string channel = 3;
  // bases are the base versions a bundle sealed before the range existed
  // fits.
  repeated string bases = 4;
  // file_name is what FetchUpdate takes, such as
  // sneakers-product-0.2.0-amd64.bin.
  string file_name = 5;
  int64 size = 6;
  // source is mirror or direct: where the index came from.
  string source = 7;
  // min_base and max_base are the bundle's base range, inclusive; max_base
  // is empty when it has no maximum, and both are empty for a bundle that
  // names exact bases only.
  string min_base = 8;
  string max_base = 9;
}

// UpdatePackage is a verified .bin's signed header.
message UpdatePackage {
  string upload_id = 1;
  string version = 2;
  string arch = 3;
  // kind is full or patch.
  string kind = 4;
  repeated string bases = 5;
  string channel = 6;
  string sha256 = 7;
  int64 size = 8;
  UpdateTarget target = 9;
  // min_base and max_base are a product bundle's base range, as in
  // ProductVersion.
  string min_base = 10;
  string max_base = 11;
  // full_bin is a Base OS patch's full release: the file the box takes
  // instead when the patch doesn't fit or doesn't rebuild.
  string full_bin = 12;
  // source is where the file came from: upload, mirror or direct.
  string source = 13;
}

// HeldUpload is a received or fetched .bin that hasn't been staged or
// discarded yet. While one is held, a new upload or fetch is refused with
// UPGRADE_BUSY.
message HeldUpload {
  string upload_id = 1;
  // file_name is the name the browser sent (X-File-Name) or the fetched
  // file's; empty when the browser sent none.
  string file_name = 2;
  int64 size = 3;
  google.protobuf.Timestamp received_at = 4;
  // source is upload, mirror or direct.
  string source = 5;
}

message UpgradeEvent {
  google.protobuf.Timestamp time = 1;
  // action is fetch, stage, apply or revert.
  string action = 2;
  string version = 3;
  string actor = 4;
  // outcome is ok or failed.
  string outcome = 5;
  string code = 6;
  string detail = 7;
  UpdateTarget target = 8;
}

// UpgradeStepState is where one step of an update stands.
enum UpgradeStepState {
  UPGRADE_STEP_STATE_UNSPECIFIED = 0;
  // UPGRADE_STEP_STATE_PENDING hasn't started.
  UPGRADE_STEP_STATE_PENDING = 1;
  // UPGRADE_STEP_STATE_ACTIVE is the step the update is on.
  UPGRADE_STEP_STATE_ACTIVE = 2;
  UPGRADE_STEP_STATE_DONE = 3;
  // UPGRADE_STEP_STATE_FAILED stopped the update; the step's detail says
  // why.
  UPGRADE_STEP_STATE_FAILED = 4;
}

// UpgradeStep is one step of a stage, apply or revert.
message UpgradeStep {
  // id is verify, stage, switch, reboot, health or mark_good for the base
  // image; verify, stage, switch or restart for a product bundle, then,
  // while the product comes up after its restart, k0s (the Kubernetes
  // API answers), images (the bundle's images are imported), manifests
  // (its stacks are applied), pods (every pod is ready) and edge (443
  // answers with the product, not the box-state page). The apply stays
  // in_progress until edge is done; it fails with UPGRADE_PRODUCT_START at
  // the step it was on when the product doesn't come up within 20 minutes.
  string id = 1;
  // label is the step as the screens show it, such as "Staging into slot
  // B".
  string label = 2;
  UpgradeStepState state = 3;
  // detail is what an active step is waiting for or doing, or why a
  // failed step failed.
  string detail = 4;
  // done_bytes of total_bytes is the step's progress where it has one
  // (the root image written into the slot); total_bytes is 0 otherwise.
  int64 done_bytes = 5;
  int64 total_bytes = 6;
}

// UpgradeProgress is the box's last stage, apply or revert, step by step.
// A base apply's steps after the reboot (checking health, marking good)
// come from the booted release's MarkGood loop.
message UpgradeProgress {
  // action is stage, apply or revert.
  string action = 1;
  UpdateTarget target = 2;
  // version is the release being staged or applied, or the one a revert
  // goes back to; empty while a stage hasn't read the file's header yet.
  string version = 3;
  // steps are in order: done, then the active or failed one, then pending.
  repeated UpgradeStep steps = 4;
  // in_progress is true while a step is active.
  bool in_progress = 5;
  // failed is true when a step failed; code is that failure's code, such
  // as UPGRADE_SIGNATURE, when it has one.
  bool failed = 6;
  string code = 7;
  google.protobuf.Timestamp started_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message GetUpgradesRequest {}

message GetUpgradesResponse {
  string running_version = 1;
  string staged_version = 2;
  string failed_version = 3;
  UpgradePolicy policy = 4;
  bool air_gapped = 5;
  repeated UpgradeEvent history = 6;
  // active_elevations are the elevated shells open now; while there is
  // one, Apply and Revert are refused unless an owner overrides it.
  repeated Elevation active_elevations = 7;
  // product is the product bundle's slots.
  ProductSlots product = 8;
  // direct_available is true when this build has a release source to
  // fetch from directly (production builds).
  bool direct_available = 9;
  // reverted_version is the newer release an admin reverted from, with who
  // did it and when; failed_version stays for a boot-counting fallback.
  string reverted_version = 10;
  string reverted_by = 11;
  google.protobuf.Timestamp reverted_at = 12;
  // previous_version is the older release kept in the other slot for a
  // revert, and previous_slot that slot, A or B (empty when the box can't
  // tell which slot it runs from). Both are empty when there's no release
  // to revert to.
  string previous_version = 13;
  string previous_slot = 14;
  // next_stage_removes are the releases staging a base update removes,
  // with their files, so Updates can say so before the stage.
  repeated string next_stage_removes = 15;
  // upgrade_progress is the last stage, apply or revert, step by step;
  // unset when the box has made none.
  UpgradeProgress upgrade_progress = 16;
  // mirror_status is the mirror's transport and its last fetch; unset when
  // no mirror is configured.
  MirrorStatus mirror_status = 17;
  // held_upload is the file waiting to be verified (staged) or discarded;
  // unset when there's none.
  HeldUpload held_upload = 18;
  // receiving is true while an upload or fetch is coming in.
  bool receiving = 19;
}

// MirrorStatus is how the box reaches the mirror and how its last fetch
// went. It's kept in memory: checked is false after a restart until the
// next mirror fetch.
message MirrorStatus {
  // scheme is http or https.
  string scheme = 1;
  // note is the transport in words, such as "plain HTTP: integrity from
  // the signature only".
  string note = 2;
  // custom_ca is true when the update trust adds a private CA, and pinned
  // when it pins the server certificate.
  bool custom_ca = 3;
  bool pinned = 4;
  // checked is true once a mirror fetch has been tried since the box
  // started; checked_at is when the last one ended.
  bool checked = 5;
  google.protobuf.Timestamp checked_at = 6;
  // ok is the last fetch's outcome; code is its refusal's symbol, such as
  // UPGRADE_MIRROR_UNTRUSTED or UPGRADE_MIRROR_PIN, and error the reason.
  bool ok = 7;
  string code = 8;
  string error = 9;
  // The server certificate the last HTTPS fetch was presented with, even
  // when it was refused: its subject, issuer, expiry and SHA-256 (colon
  // hex).
  string server_subject = 10;
  string server_issuer = 11;
  google.protobuf.Timestamp server_not_after = 12;
  string server_sha256 = 13;
  // pin_matched is true when the pinned fingerprint matched it.
  bool pin_matched = 14;
}

message FetchUpdateRequest {
  // file_name is the .bin's name, such as
  // sneakers-appliance-0.2.0-amd64.bin, or a product bundle's from
  // ListProductVersions, such as sneakers-product-0.2.0-amd64.bin.
  string file_name = 1;
}

message FetchUpdateResponse {
  string upload_id = 1;
  // source is mirror or direct.
  string source = 2;
}

message StageUpdateRequest {
  string upload_id = 1;
  // override_product_range stages a base release even though the
  // installed product bundle's base range doesn't include it; without it
  // that stage is refused with UPGRADE_PRODUCT_BASE.
  bool override_product_range = 2;
}

message StageUpdateResponse {
  UpdatePackage package = 1;
  // slot is the base slot the release was staged into, A or B; empty for a
  // product bundle, or when the box can't tell which slot it runs from.
  string slot = 2;
}

// ElevationOverride ends an open elevated shell so an apply or revert can
// go ahead. The session is terminated and audited with the reason, and the
// apply or revert waits until it has ended.
message ElevationOverride {
  // elevation_id is the active session being ended, such as E-7KQ2.
  string elevation_id = 1;
  // confirm is typed by the owner: the session's admin, a space, and the
  // request id, such as "bob E-7KQ2".
  string confirm = 2;
  // reason is why the session is ended; it goes into the audit entry.
  string reason = 3;
}

message ApplyUpdateRequest {
  ElevationOverride elevation_override = 1;
  UpdateTarget target = 2;
  // totp_code is a fresh code from the owner's authenticator.
  string totp_code = 3;
}

message ApplyUpdateResponse {}

message RevertUpdateRequest {
  ElevationOverride elevation_override = 1;
  UpdateTarget target = 2;
  // totp_code is a fresh code from the owner's authenticator.
  string totp_code = 3;
}

message DiscardUpdateRequest {
  // upload_id is the held upload or fetched file to drop.
  string upload_id = 1;
  // target is what to unstage when upload_id is empty: the base release or
  // the product bundle.
  UpdateTarget target = 2;
}

message DiscardUpdateResponse {
  // version is the release unstaged; empty when an upload was dropped.
  string version = 1;
}

message ListBaseVersionsRequest {}

message ListBaseVersionsResponse {
  // versions are newest first.
  repeated BaseVersion versions = 1;
  // base_version is the running base they were matched against.
  string base_version = 2;
}

// BaseVersion is one base release a source offers.
message BaseVersion {
  string version = 1;
  string arch = 2;
  string channel = 3;
  // kind is full or patch.
  string kind = 4;
  // bases are the base versions a patch applies to.
  repeated string bases = 5;
  // file_name is what FetchUpdate takes, such as
  // sneakers-appliance-0.3.0-amd64.bin.
  string file_name = 6;
  int64 size = 7;
  // source is mirror or direct: where the index came from.
  string source = 8;
  // outside_product_range is set when the installed product bundle's base
  // range doesn't include this release: staging it is refused
  // (UPGRADE_PRODUCT_BASE) unless an owner overrides it
  // (StageUpdate.override_product_range). product_range is that range,
  // such as "0.2.0 to 0.3.0".
  bool outside_product_range = 9;
  string product_range = 10;
}

message ListProductVersionsRequest {}

message ListProductVersionsResponse {
  // versions are newest first.
  repeated ProductVersion versions = 1;
  // base_version is the running base they were matched against.
  string base_version = 2;
}

message RevertUpdateResponse {}

message SetUpgradePolicyRequest {
  UpgradePolicy policy = 1;
}

message SetUpgradePolicyResponse {}
