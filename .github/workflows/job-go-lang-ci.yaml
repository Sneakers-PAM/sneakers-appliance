name: GolangCI
# Pull requests only, and not while the PR is a draft. There is no push trigger:
# the PR run already tested the tree being merged, so nothing reruns on push to
# a branch or to main.
on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
env:
  BUF_VERSION: v1.70.0
  PROTOC_GEN_GO_VERSION: v1.36.11
  PROTOC_GEN_CONNECT_GO_VERSION: v1.21.0
jobs:
  changes:
    if: github.event.pull_request.draft != true
    uses: ./.github/workflows/changes.yml
  build-test:
    name: 🧪 Build & Test
    needs: changes
    if: ${{ !cancelled() && github.event.pull_request.draft == false && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi
      # go install checks each module against the Go checksum database.
      - name: Install buf and the protoc plugins
        run: |
          go install "github.com/bufbuild/buf/cmd/buf@${BUF_VERSION}"
          go install "google.golang.org/protobuf/cmd/protoc-gen-go@${PROTOC_GEN_GO_VERSION}"
          go install "connectrpc.com/connect/cmd/protoc-gen-connect-go@${PROTOC_GEN_CONNECT_GO_VERSION}"
      - name: Generated code is current
        run: |
          scripts/proto-generate.sh
          git diff --exit-code -- gen
          test -z "$(git status --porcelain -- gen)"
      - name: buf lint
        run: buf lint
      - name: buf breaking
        run: |
          if git cat-file -e origin/main:proto 2>/dev/null; then
            git worktree add -q --detach "$RUNNER_TEMP/base" origin/main
            buf breaking proto --against "$RUNNER_TEMP/base/proto"
          else
            echo "main has no proto yet; nothing to compare against"
          fi
      - name: Install veritysetup and sgdisk
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q cryptsetup-bin gdisk qemu-utils
      - name: Build
        run: go build ./...
      - name: Test
        env:
          SNEAKERS_REQUIRE_TOOLS: "1"
        run: go test ./... -cover
      # netd and the firewall run against real network namespaces, which
      # need root; as the runner user they skip.
      - name: Network namespace tests (root)
        env:
          SNEAKERS_REQUIRE_NETNS: "1"
        run: |
          sudo -E env "PATH=$PATH" "GOCACHE=$(go env GOCACHE)" "GOMODCACHE=$(go env GOMODCACHE)" \
            go test -count=1 ./internal/netd/ ./internal/firewall/
  lint:
    name: 🧹 GolangCI
    needs: changes
    if: ${{ !cancelled() && github.event.pull_request.draft == false && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - name: GolangCI
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        with:
          version: v2.12.2
          # Build from source with the job's Go, so a newer go.mod never
          # outruns the toolchain the prebuilt binary was compiled with.
          install-mode: goinstall
          args: --timeout=3m
  lab-tools:
    name: 🔑 Lab keys and tool interop
    needs: changes
    if: ${{ !cancelled() && github.event.pull_request.draft == false && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The release guard's test checks a commit on main and one that isn't.
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install efitools and cosign
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q efitools sbsigntool squashfs-tools cryptsetup-bin cpio systemd-ukify systemd-boot-efi python3-pefile
          bash build/ci/install-cosign.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Release environments keep the keys apart, the production units, pinned actions, the docs-only skip, the real-bundle pins and its key-free caches
        run: |
          bash build/release/environments_test.sh
          bash build/release/units_test.sh
          bash build/ci/pinned_actions_test.sh
          bash build/ci/image_e2e_runs_test.sh
          bash build/ci/docs_only_test.sh
          bash build/realci/pins_test.sh
          bash build/realci/cache_test.sh
      - name: Lab keys, cosign, efitools, sbsign and unsquashfs interop
        run: go test -tags tools ./test/kit/labkeys/
      - name: Lab keys never silently regenerate an existing set
        run: bash build/keys/lab-keys_test.sh
      - name: Root image is reproducible and holds the declared tree
        run: bash build/root/build_test.sh
      - name: Release guard, production fingerprint and key checks, file names, kit floor, lab pages stamp and unit input digests
        run: |
          bash build/release/guard_test.sh
          bash build/release/check-fingerprints_test.sh
          bash build/release/check-asset-sizes_test.sh
          bash build/release/check-names_test.sh
          bash build/release/check-production-keys_test.sh
          bash build/release/check-production-keys.sh --allow-empty keys/production
          bash build/release/build_test.sh
          bash build/release/kitmin_test.sh
          bash build/lab/pages_test.sh
          bash build/lab/units_test.sh
      - name: The production product bundle's stacks are complete and carry no lab value
        run: bash build/product/sneakers/render_test.sh
