name: Static tools
# The static OpenSSH and busybox the root image carries, built from the pins
# in build/openssh/versions.env on a native runner per architecture. The
# outputs are cached by the hash of their inputs, so a PR that doesn't touch
# them restores the cache instead of rebuilding. Pull requests only, and not
# while the PR is a draft.
on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  changes:
    if: github.event.pull_request.draft != true
    uses: ./.github/workflows/changes.yml
  static-tools:
    name: 🔧 Static OpenSSH and busybox (${{ matrix.arch }})
    needs: changes
    if: ${{ !cancelled() && github.event.pull_request.draft == false && needs.changes.outputs.docs_only != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Restore the outputs
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: out/static
          key: static-tools-${{ matrix.arch }}-${{ hashFiles('build/openssh/**', 'build/busybox/**', 'build/lib/**') }}
      - name: Build busybox
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash build/busybox/build.sh out/static
      - name: Build OpenSSH
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash build/openssh/build.sh out/static
      - name: Check the outputs
        run: bash build/openssh/test.sh out/static
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check the rendered sshd_config with sshd -t, and run sshd-run on it
        # sshd -t needs its privilege separation user and directory, as on
        # the box.
        run: |
          id sshd >/dev/null 2>&1 || sudo useradd --system --no-create-home --shell /usr/sbin/nologin sshd
          sudo mkdir -p /run/sneakers/sshd-empty
          SNEAKERS_TEST_SSHD="$PWD/out/static/sshd" SNEAKERS_REQUIRE_SSHD=1 go test -count=1 -run 'Sshd|Check' ./internal/sshconfig/ ./internal/sshdrun/
      - name: Report the digests
        run: |
          {
            echo "### Static tools (${{ matrix.arch }})"
            echo
            echo '| Binary | SHA-256 |'
            echo '|---|---|'
            for b in sshd sshd-session sshd-auth ssh-keygen busybox; do
              echo "| \`$b\` | \`$(sha256sum "out/static/$b" | cut -d' ' -f1)\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: static-tools-${{ matrix.arch }}
          path: out/static
          retention-days: 7
