name: checks
# The org's scrub (gitleaks, generic identifier patterns, DCO) over the PR's
# commits, title and body. The ruleset on main requires its `checks / scrub`
# status, so the caller job keeps the id `checks`. `edited` reruns it when the
# PR title or body changes.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    if: github.event.pull_request.draft != true
    uses: Sneakers-PAM/.github/.github/workflows/scrub.yml@main
    with:
      # in-toto.io is the public in-toto statement type URI that cosign
      # writes into its signatures; the test fixtures write the same.
      # cloud.google.com, dmitri.shuralyov.com, go.opencensus.io, honnef.co
      # and rsc.io are public module hosts in go.sum (indirect dependencies
      # of go-uefi). filippo.io, c2sp.org, oras.land and connectrpc.com are
      # module hosts. acme.com
      # and api.acme.com are the example hosts protoc-gen-connect-go writes
      # into every generated client's doc comment.
      # kernel.org (cdn, git) and deb.debian.org are where the pinned kernel
      # and static tool sources come from. schemas.dmtf.org, www.vmware.com
      # and www.w3.org are the XML namespaces of the OVF descriptor.
      # cdn.openbsd.org and busybox.net are the source hosts of the pinned
      # static OpenSSH and busybox tarballs (build/openssh, build/busybox).
      allowed-domains: >-
        kernel.org
        cdn.kernel.org
        git.kernel.org
        deb.debian.org
        schemas.dmtf.org
        www.vmware.com
        www.w3.org
        in-toto.io
        cloud.google.com
        dmitri.shuralyov.com
        go.opencensus.io
        honnef.co
        rsc.io
        filippo.io
        c2sp.org
        oras.land
        connectrpc.com
        acme.com
        api.acme.com
        cdn.openbsd.org
        busybox.net
