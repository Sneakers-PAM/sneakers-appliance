name: checks
# The org's scrub (gitleaks, generic identifier patterns, DCO) over the PR's
# commits, title and body. The ruleset on main requires its `checks / scrub`
# status, so the caller job keeps the id `checks`. `edited` reruns it when the
# PR title or body changes.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    if: github.event.pull_request.draft != true
    uses: Sneakers-PAM/.github/.github/workflows/scrub.yml@main
    with:
      # in-toto.io is the public in-toto statement type URI that cosign
      # writes into its signatures; the test fixtures write the same.
      # cloud.google.com, dmitri.shuralyov.com, go.opencensus.io, honnef.co
      # and rsc.io are public module hosts in go.sum (indirect dependencies
      # of go-uefi). oras.land is the oras-go module host.
      allowed-domains: >-
        in-toto.io
        cloud.google.com
        dmitri.shuralyov.com
        go.opencensus.io
        honnef.co
        rsc.io
        oras.land
