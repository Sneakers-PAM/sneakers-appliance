name: Label Sync
# Reconciles the repo's labels to the canonical set (.github/labels.yml):
# creates/updates the canonical labels AND deletes any label not in the file,
# so every repo carries exactly the standard set (no stale GitHub defaults or
# leftover release labels).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/labels.yml']
permissions:
  contents: read
  issues: write
jobs:
  labeler:
    name: 🏷️ Sync labels
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Reconcile labels with labels.yml
        uses: crazy-max/ghaction-github-labeler@24d110aa46a59976b8a7f35518cb7f14f434c916  # v5.3.0
        with:
          yaml-file: .github/labels.yml
          skip-delete: false
          dry-run: false
