name: Data Move Rehearsal
# The data move against the real charts on a throwaway kind cluster, on amd64
# and arm64 (docs/data-move.md#testing-it): the old cluster seeded with the real
# services on it, the real move killed mid-dump, mid-restore and before the
# switch, then run through, every table compared and the services started on
# the new cluster. Every service image is built in the job and never pushed, so
# it runs on pull requests that touch the move or the Sneakers product, and by
# hand. Where no arm64 runner is available, set the repository variable
# ARM64_RUNNER to none and that leg is skipped.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'internal/datamove/**'
      - 'internal/boxsecrets/**'
      - 'internal/productspec/**'
      - 'build/product/sneakers/**'
      - 'build/realci/pins.env'
      - 'test/datamove/**'
      - '.github/workflows/data-move.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: data-move-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  rehearsal:
    name: 🚚 Data move on kind (${{ matrix.arch }})
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(vars.ARM64_RUNNER == 'none' && '["amd64"]' || '["amd64","arm64"]') }}
    env:
      KIND_CLUSTER: sneakers
      KIND_NODE_IMAGE: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Read the sneakers-release commit
        id: pins
        run: |
          # shellcheck source=build/realci/pins.env
          source build/realci/pins.env
          echo "release=${NEXT_RELEASE_COMMIT:-main}" >> "$GITHUB_OUTPUT"
      - name: Checkout sneakers-release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: Sneakers-PAM/sneakers-release
          ref: ${{ steps.pins.outputs.release }}
          path: sneakers-release
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install tools
        run: |
          sneakers-release/scripts/install-tools.sh "$RUNNER_TEMP/bin" helm kind kubectl
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Create the cluster
        run: kind create cluster --name "$KIND_CLUSTER" --image "$KIND_NODE_IMAGE" --wait 180s
      - name: Build the service images
        run: sneakers-release/test/kind/build-images.sh
      - name: Rehearse
        env:
          CHARTS: ${{ github.workspace }}/sneakers-release
          WORK_DIR: ${{ runner.temp }}/rehearsal
          SEED_ROWS: "400000"
          AUDIT_ROWS: "100000"
        run: bash test/datamove/rehearsal.sh
      - name: A new box, with nothing to move
        env:
          CHARTS: ${{ github.workspace }}/sneakers-release
          WORK_DIR: ${{ runner.temp }}/rehearsal
        run: bash test/datamove/new-box.sh
      - name: Results
        if: always()
        run: cat "$RUNNER_TEMP/rehearsal/results.txt" 2>/dev/null || true
      - name: Diagnostics
        if: failure()
        run: |
          kubectl -n sneakers get pods,events -o wide || true
          for p in $(kubectl -n sneakers get pods -o name 2>/dev/null); do
            echo "::group::$p"
            kubectl -n sneakers logs "$p" --all-containers --tail=80 | grep -v "(shown once)" || true
            echo "::endgroup::"
          done
