name: Release
# The production release, on an owner-created v tag only, and a lab dry run
# by hand. A release ships three update units per architecture, Base OS,
# Base Web and Product, each a signed and encrypted .bin, with the index a
# mirror serves (docs/release.md).
#
# Production (push of a v tag): guard -> images (every Sneakers service
# image, built from the source the pinned release.yaml names; no keys) ->
# build (no keys, no environment) -> sign (the production environment, the
# only job that reads its secrets) -> publish (verify, push the service
# images and sneakers-os to GHCR by digest, attach the units, the index and
# the countersignatures to the tag's GitHub Release).
#
# Lab (workflow_dispatch): one job with keys made for that run only, never
# the production environment, and nothing published or uploaded.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: The lab version to build (a lab dry run; nothing is published)
        required: true
        default: 0.0.1
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  guard:
    name: 🛡️ Guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.guard.outputs.version }}
      channel: ${{ steps.guard.outputs.channel }}
      release_repo: ${{ steps.guard.outputs.release_repo }}
      release_commit: ${{ steps.guard.outputs.release_commit }}
      web_repo: ${{ steps.guard.outputs.web_repo }}
      web_commit: ${{ steps.guard.outputs.web_commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
      - name: Check the tag, its commit and the pins
        id: guard
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          INPUT_VERSION: ${{ inputs.version }}
        run: bash build/release/guard.sh
      # Before the long build: a production tag needs the committed public
      # keys, every one labelled Production and none from a known lab set.
      - name: Check the production public keys
        if: github.event_name == 'push'
        run: bash build/release/check-production-keys.sh keys/production

  images:
    name: 🐳 Service images (amd64)
    needs: guard
    if: needs.guard.outputs.channel == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Check out the pinned sneakers-release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          repository: ${{ needs.guard.outputs.release_repo }}
          ref: ${{ needs.guard.outputs.release_commit }}
          path: .pinned/sneakers-release
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.6.0
        with:
          go-version-file: go.mod
      # Each service image is built from the repository and full commit its
      # build block in the pinned release.yaml names, with that
      # repository's own Dockerfile. Nothing is pushed here.
      - name: Build the service images
        env:
          RELEASE_COMMIT: ${{ needs.guard.outputs.release_commit }}
        run: |
          [ "$(git -C .pinned/sneakers-release rev-parse HEAD)" = "$RELEASE_COMMIT" ]
          RELEASE=.pinned/sneakers-release/manifest/release.yaml OUT="$RUNNER_TEMP/service-images" \
            bash build/release/images.sh
          {
            echo "### Service images (amd64)"
            echo '```'
            for d in "$RUNNER_TEMP"/service-images/*/; do
              echo "$(basename "$d") $(sed -n 's/.*"digest":"\(sha256:[0-9a-f]\{64\}\)".*/\1/p' "$d/index.json" | head -1)"
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the service images
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: service-images-amd64
          path: ${{ runner.temp }}/service-images
          if-no-files-found: error
          retention-days: 7

  build:
    name: 🏗️ Build (unsigned, amd64)
    needs: [guard, images]
    if: needs.guard.outputs.channel == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
      # The release.yaml and the :8443 pages come from these repositories at
      # the full commits build/release/pins.env pins (git content, not a
      # release asset).
      - name: Check out the pinned sneakers-release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          repository: ${{ needs.guard.outputs.release_repo }}
          ref: ${{ needs.guard.outputs.release_commit }}
          path: .pinned/sneakers-release
          persist-credentials: false
      - name: Check out the pinned sneakers-web
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          repository: ${{ needs.guard.outputs.web_repo }}
          ref: ${{ needs.guard.outputs.web_commit }}
          path: .pinned/sneakers-web
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.6.0
        with:
          go-version-file: go.mod
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '24'
      - name: Download the service images
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: service-images-amd64
          path: ${{ runner.temp }}/service-images
      # Before the long build: every service image the pinned release.yaml
      # names was built, and with its digests in place every image is
      # pinned by a digest, not a placeholder.
      - name: Check the pinned release.yaml
        env:
          RELEASE_COMMIT: ${{ needs.guard.outputs.release_commit }}
        run: |
          [ "$(git -C .pinned/sneakers-release rev-parse HEAD)" = "$RELEASE_COMMIT" ]
          go run ./build/tools/bundle fill --release .pinned/sneakers-release/manifest/release.yaml \
            --layouts "$RUNNER_TEMP/service-images" > "$RUNNER_TEMP/release-filled.yaml"
          go run ./build/tools/bundle images --release "$RUNNER_TEMP/release-filled.yaml"
      - name: Install the build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q build-essential bc bison flex libelf-dev libssl-dev \
            squashfs-tools cryptsetup-bin cpio systemd-ukify systemd-boot-efi python3-pefile
      - name: Build the kernel
        env:
          SOURCE_DATE_EPOCH: "1700000000"
        run: bash build/kernel/build.sh amd64
      - name: Build the static cryptsetup, mke2fs and sgdisk
        run: |
          bash build/static/cryptsetup.sh amd64
          bash build/static/e2fsprogs.sh amd64
          bash build/static/gptfdisk.sh amd64
      - name: Build the static OpenSSH and busybox
        run: |
          bash build/busybox/build.sh out/static
          bash build/openssh/build.sh out/static
      - name: Build the release, unsigned
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          KERNEL=build/out/kernel/amd64/bzImage \
          KERNELRELEASE="$(cat build/out/kernel/amd64/kernelrelease)" \
          VERITYSETUP=build/out/veritysetup-amd64 \
          OPENSSH=out/static BUSYBOX=out/static/busybox STATIC=build/out \
          RELEASE=.pinned/sneakers-release/manifest/release.yaml WEB=.pinned/sneakers-web \
          CHARTS=.pinned/sneakers-release SERVICE_IMAGES="$RUNNER_TEMP/service-images" \
          OUT="$RUNNER_TEMP/unsigned" bash build/release/build.sh
          {
            echo "### Unsigned build ${VERSION} (amd64)"
            echo '```'
            cat "$RUNNER_TEMP/unsigned/SHA256SUMS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the unsigned build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: unsigned-amd64
          path: ${{ runner.temp }}/unsigned
          if-no-files-found: error
          retention-days: 7

  sign:
    name: 🔏 Sign (production)
    needs: [guard, build]
    if: needs.guard.outputs.channel == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Download the unsigned build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: unsigned-amd64
          path: ${{ runner.temp }}/unsigned
      - name: Download the service images
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: service-images-amd64
          path: ${{ runner.temp }}/service-images
      - name: Install the pinned signers
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q sbsigntool
          bash build/ci/install-cosign.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.6.0
        with:
          go-version-file: go.mod
      - name: Check the digests and the production public keys
        run: |
          (cd "$RUNNER_TEMP/unsigned" && sha256sum -c --quiet SHA256SUMS)
          bash build/release/check-production-keys.sh keys/production
          bash build/release/check-fingerprints.sh keys/production keys/production/fingerprints.txt
      # The release tool is built here from the tagged commit, not taken from
      # the build job. Each key is written to tmpfs only inside the step that
      # uses it, and removed in that step.
      - name: Build the release tool and mount the key tmpfs
        run: |
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/sneakers-artifact" ./cmd/sneakers-artifact
          mkdir -p "$RUNNER_TEMP/keys" "$RUNNER_TEMP/work" "$RUNNER_TEMP/signed"
          sudo mount -t tmpfs -o size=1m,mode=0700,uid="$(id -u)" tmpfs "$RUNNER_TEMP/keys"
      # The update key goes into the UKI before the db key signs it, so the
      # signature covers it; the box reads it from the booted UKI, in memory
      # only (docs/release.md). uki-add-key refuses a key that isn't the
      # committed keys/production/update.pub's.
      - name: Add the update key to the UKI
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          UPDATE_AGE_KEY: ${{ secrets.UPDATE_AGE_KEY }}
        run: |
          keys="$RUNNER_TEMP/keys" in="$RUNNER_TEMP/unsigned" work="$RUNNER_TEMP/work"
          umask 077
          printf '%s\n' "$UPDATE_AGE_KEY" > "$keys/update.key"
          trap 'rm -f "$keys/update.key"' EXIT
          "$RUNNER_TEMP/sneakers-artifact" uki-add-key --uki "$in/sneakers-$VERSION.efi" \
            --key "$keys/update.key" --recipient keys/production/update.pub --out "$work/sneakers-$VERSION.keyed.efi"
      - name: Sign the UKI and systemd-boot (db key)
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          SB_DB_KEY: ${{ secrets.SB_DB_KEY }}
        run: |
          keys="$RUNNER_TEMP/keys" in="$RUNNER_TEMP/unsigned" work="$RUNNER_TEMP/work"
          umask 077
          printf '%s\n' "$SB_DB_KEY" > "$keys/db.key"
          trap 'rm -f "$keys/db.key"' EXIT
          have="$(openssl pkey -in "$keys/db.key" -pubout -outform DER | sha256sum | cut -d' ' -f1)"
          want="$(openssl x509 -in keys/production/db.crt -noout -pubkey | openssl pkey -pubin -outform DER | sha256sum | cut -d' ' -f1)"
          [ "$have" = "$want" ] || { echo "SB_DB_KEY doesn't belong to keys/production/db.crt" >&2; exit 1; }
          sbsign --key "$keys/db.key" --cert keys/production/db.crt --output "$work/sneakers-$VERSION.efi" "$work/sneakers-$VERSION.keyed.efi"
          sbsign --key "$keys/db.key" --cert keys/production/db.crt --output "$work/systemd-bootx64.efi" "$in/systemd-bootx64.efi"
      # The appliance countersigns what it ships from sneakers-release: the
      # release.yaml at the pinned commit and the manifest of every image it
      # pins, only after checking each manifest hashes to its pinned digest.
      # The bundles go on the Release with the units.
      - name: Countersign release.yaml and the pinned images (release key)
        env:
          RELEASE_COSIGN_KEY: ${{ secrets.RELEASE_COSIGN_KEY }}
          COSIGN_PASSWORD: ${{ secrets.RELEASE_COSIGN_PASSWORD }}
        run: |
          keys="$RUNNER_TEMP/keys" in="$RUNNER_TEMP/unsigned" cs="$RUNNER_TEMP/signed/countersignatures"
          go run ./build/tools/bundle images --release "$in/release.yaml" | diff - "$in/images.txt"
          mkdir -p "$cs/image-sigs"
          umask 077
          printf '%s\n' "$RELEASE_COSIGN_KEY" > "$keys/cosign.key"
          trap 'rm -f "$keys/cosign.key"' EXIT
          have="$(cosign public-key --key "$keys/cosign.key" | openssl pkey -pubin -outform DER | sha256sum | cut -d' ' -f1)"
          want="$(openssl pkey -pubin -in keys/production/cosign.pub -outform DER | sha256sum | cut -d' ' -f1)"
          [ "$have" = "$want" ] || { echo "RELEASE_COSIGN_KEY doesn't belong to keys/production/cosign.pub" >&2; exit 1; }
          sign() { cosign sign-blob --yes --key "$keys/cosign.key" --bundle "$2" --tlog-upload=false --use-signing-config=false "$1" >/dev/null; }
          while read -r image dgst; do
            hexd="${dgst#sha256:}"
            [ "$(sha256sum < "$in/manifests/$hexd" | cut -d' ' -f1)" = "$hexd" ] || { echo "$image: the manifest isn't $dgst" >&2; exit 1; }
            sign "$in/manifests/$hexd" "$cs/image-sigs/$hexd.sigstore.json"
          done < "$in/images.txt"
          sign "$in/release.yaml" "$cs/release.yaml.sigstore.json"
          echo "countersigned release.yaml and $(wc -l < "$in/images.txt") images"
      - name: Assemble the artifact
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          in="$RUNNER_TEMP/unsigned" work="$RUNNER_TEMP/work" cs="$RUNNER_TEMP/signed/countersignatures"
          # shellcheck source=build/release/pins.env
          source build/release/pins.env
          "$RUNNER_TEMP/sneakers-artifact" assemble --arch amd64 --version "$VERSION" --channel production \
            --kit-min "$KIT_MIN" --systemd "$(cat "$in/systemd-version")" \
            --release "$in/release.yaml" --release-sig "$cs/release.yaml.sigstore.json" \
            --root "$in/root-$VERSION.img" --verity-json "$in/verity.json" \
            --uki "$work/sneakers-$VERSION.efi" --loader "$work/systemd-bootx64.efi" --keys keys/production \
            --pk-cert keys/production/PK.crt --kek-cert keys/production/KEK.crt --db-cert keys/production/db.crt \
            --out "$RUNNER_TEMP/signed/artifact"
          "$RUNNER_TEMP/sneakers-artifact" index-blob --layout "$RUNNER_TEMP/signed/artifact" > "$work/index-blob"
      - name: Sign the artifact (release key)
        env:
          RELEASE_COSIGN_KEY: ${{ secrets.RELEASE_COSIGN_KEY }}
          COSIGN_PASSWORD: ${{ secrets.RELEASE_COSIGN_PASSWORD }}
        run: |
          keys="$RUNNER_TEMP/keys" work="$RUNNER_TEMP/work"
          umask 077
          printf '%s\n' "$RELEASE_COSIGN_KEY" > "$keys/cosign.key"
          trap 'rm -f "$keys/cosign.key"' EXIT
          cosign sign-blob --yes --key "$keys/cosign.key" --bundle "$work/artifact.sigstore.json" \
            --tlog-upload=false --use-signing-config=false "$(cat "$work/index-blob")" >/dev/null
          "$RUNNER_TEMP/sneakers-artifact" attach --layout "$RUNNER_TEMP/signed/artifact" --bundle "$work/artifact.sigstore.json"
      # The product bundle: k0s, helm, every pinned image (the service images
      # from the images job's layouts, the rest from their registries), each
      # checked against its countersignature, the Sneakers stacks the build
      # job rendered and product.yaml, for this release's base and newer.
      # The bundle check refuses it without every component product.yaml
      # names. It needs no private key: it's encrypted to the committed
      # update.pub.
      - name: Build the product bundle
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          in="$RUNNER_TEMP/unsigned" work="$RUNNER_TEMP/work" cs="$RUNNER_TEMP/signed/countersignatures"
          chmod +x "$in/k0s"
          helm=()
          if [ -f "$in/helm" ]; then chmod +x "$in/helm"; helm=(HELM="$in/helm"); fi
          inputs="$(RELEASE="$in/release.yaml" STACKS="$in/stacks" bash build/lab/units.sh inputs product)"
          env "${helm[@]}" VERSION="$VERSION" ARCH=amd64 CHANNEL=production MIN_BASE="$VERSION" BASES="$VERSION" \
            RELEASE="$in/release.yaml" RELEASE_KEY=keys/production/cosign.pub SIGNATURES="$cs/image-sigs" \
            K0S="$in/k0s" RECIPIENT=keys/production/update.pub INPUTS="$inputs" OUT="$work/product" \
            STACKS="$in/stacks" PRODUCT_YAML="$in/product.yaml" LAYOUTS="$RUNNER_TEMP/service-images" \
            bash build/product/build.sh
      # The three units, sealed by build/lab/units.sh on the production
      # channel, from the layout a lab build leaves: the signed artifact, the
      # signed UKI, the pages, release.yaml and the sealed product bundle.
      # The first production release is full units only: no bridge, no patch.
      - name: Seal the units (release key)
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          RELEASE_COSIGN_KEY: ${{ secrets.RELEASE_COSIGN_KEY }}
          COSIGN_PASSWORD: ${{ secrets.RELEASE_COSIGN_PASSWORD }}
        run: |
          keys="$RUNNER_TEMP/keys" in="$RUNNER_TEMP/unsigned" work="$RUNNER_TEMP/work" rel="$RUNNER_TEMP/work/release"
          mkdir -p "$rel/work" "$rel/product"
          printf '%s\n' "$VERSION" > "$rel/version"
          cp -r "$RUNNER_TEMP/signed/artifact" "$rel/artifact"
          cp "$work/sneakers-$VERSION.efi" "$rel/work/"
          cp -r "$in/pages" "$rel/work/osadmin"
          cp "$in/release.yaml" "$rel/work/release.yaml"
          cp keys/production/cosign.pub keys/production/update.pub "$keys/"
          umask 077
          printf '%s\n' "$RELEASE_COSIGN_KEY" > "$keys/cosign.key"
          trap 'rm -f "$keys/cosign.key"' EXIT
          umask 022
          cosign sign-blob --yes --key "$keys/cosign.key" --bundle "$work/product/bin/header.sigstore.json" \
            --tlog-upload=false --use-signing-config=false "$work/product/bin/header.json" >/dev/null
          "$RUNNER_TEMP/sneakers-artifact" bin-seal --work "$work/product/bin" \
            --bundle "$work/product/bin/header.sigstore.json" --out "$rel/product" >/dev/null
          CHANNEL=production COMMIT="$GITHUB_SHA" BASEOS_INPUTS="$(cat "$in/inputs-baseOS")" STACKS="$in/stacks" \
            OUT="$rel" KEYS="$keys" UNITS="$RUNNER_TEMP/signed/units" bash build/lab/units.sh
      - name: Verify the units
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          in="$RUNNER_TEMP/unsigned" work="$RUNNER_TEMP/work" units="$RUNNER_TEMP/signed/units"
          tool="$RUNNER_TEMP/sneakers-artifact"
          chmod +x "$in/sneakers-kit"
          [ "$(find "$units" -maxdepth 1 -name '*.bin' | wc -l)" -eq 3 ] || { ls -l "$units"; echo "want three units" >&2; exit 1; }
          # The box's path for each: verify, decrypt with the key in the signed
          # UKI and unpack; the production kit checks the Base OS layout, and
          # the product bundle gets the box's bundle check.
          for b in "$units"/*.bin; do
            check="$work/check/$(basename "$b")"
            "$tool" bin-verify --release-key keys/production/cosign.pub --channel production \
              --identity-uki "$work/sneakers-$VERSION.efi" --extract "$check" "$b"
            case "$(basename "$b")" in
              sneakers-appliance-baseOS-*) "$in/sneakers-kit" verify "$check" ;;
            esac
            if "$tool" bin-verify --release-key keys/production/cosign.pub --channel lab "$b" 2>/dev/null; then
              echo "$(basename "$b") verified as lab" >&2; exit 1
            fi
          done
          (cd "$units" && sha256sum -c --quiet SHA256SUMS)
          {
            echo "### Signed units ${VERSION} (amd64)"
            echo '```'
            for b in "$units"/*.bin; do echo "$(basename "$b") $(stat -c %s "$b") bytes, inputs $(cat "$b.inputs")"; done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Wipe the keys
        if: always()
        run: |
          sudo umount "$RUNNER_TEMP/keys" || true
          rm -rf "$RUNNER_TEMP/work"
      - name: Upload the signed release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: signed-amd64
          path: ${{ runner.temp }}/signed
          if-no-files-found: error
          retention-days: 7

  publish:
    name: 📦 Publish
    needs: [guard, sign]
    if: needs.guard.outputs.channel == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Download the builds
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: '*-amd64'
          path: ${{ runner.temp }}
      - name: Install the pinned cosign
        run: |
          bash build/ci/install-cosign.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.6.0
        with:
          go-version-file: go.mod
      - name: Verify, push and attach
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          in="$RUNNER_TEMP/unsigned-amd64" signed="$RUNNER_TEMP/signed-amd64"
          units="$signed/units" cs="$signed/countersignatures"
          (cd "$in" && sha256sum -c --quiet SHA256SUMS)
          (cd "$units" && sha256sum -c --quiet SHA256SUMS)
          chmod +x "$in/sneakers-artifact" "$in/sneakers-kit"
          "$in/sneakers-kit" verify "$signed/artifact"
          for b in "$units"/*.bin; do
            "$in/sneakers-artifact" bin-verify --release-key keys/production/cosign.pub --channel production "$b"
          done
          verify() { cosign verify-blob --key keys/production/cosign.pub --bundle "$2" --insecure-ignore-tlog=true "$1" >/dev/null; }
          verify "$in/release.yaml" "$cs/release.yaml.sigstore.json"
          while read -r image dgst; do
            verify "$in/manifests/${dgst#sha256:}" "$cs/image-sigs/${dgst#sha256:}.sigstore.json"
          done < "$in/images.txt"
          # Every service image the release built, to the image release.yaml
          # names, by the digest it pins (and the version tag); each push is
          # read back by that digest.
          go run ./build/tools/bundle push --release "$in/release.yaml" --layouts "$RUNNER_TEMP/service-images-amd64" --tag "$VERSION"
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sneakers-os"
          digest="$("$in/sneakers-artifact" push --layout "$signed/artifact" --repo "$repo" --tag "$VERSION")"
          "$in/sneakers-kit" verify "$repo@$digest"
          # The Release the owner made for the tag (a draft is fine); a draft
          # is made when there's none. Nothing here publishes it.
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$TAG" \
              --notes "Sneakers appliance $VERSION. Draft made by the release workflow; the owner publishes it."
          fi
          cp "$in/release.yaml" "$cs/release.yaml"
          files=("$units"/*.bin "$units"/*.bin.inputs "$units/sneakers-product-index.json" "$units/SHA256SUMS"
            "$cs/release.yaml" "$cs/release.yaml.sigstore.json" "$cs"/image-sigs/*.sigstore.json)
          gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          {
            echo "### Published $VERSION"
            echo "- sneakers-os: $repo@$digest"
            go run ./build/tools/bundle sources --release "$in/release.yaml" | while read -r name image _; do
              echo "- $name: $image@$(sed -n "s|^$image ||p" "$in/images.txt")"
            done
            for b in "$units"/*.bin; do echo "- $(basename "$b") ($(sha256sum < "$b" | cut -d' ' -f1))"; done
            echo "- release.yaml and $(wc -l < "$in/images.txt") image countersignatures"
          } >> "$GITHUB_STEP_SUMMARY"
  lab:
    name: 🧪 Lab dry run (never published)
    needs: guard
    if: needs.guard.outputs.channel == 'lab'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Never the production environment. The lab environment holds no keys:
    # this job makes a fresh lab set for the run (docs/release.md).
    environment: lab
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.6.0
        with:
          go-version-file: go.mod
      - name: Install the build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q build-essential bc bison flex libelf-dev libssl-dev \
            efitools sbsigntool squashfs-tools cryptsetup-bin cpio \
            systemd-ukify systemd-boot-efi python3-pefile
          bash build/ci/install-cosign.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Build the kernel
        env:
          SOURCE_DATE_EPOCH: "1700000000"
        run: bash build/kernel/build.sh amd64
      - name: Build the static cryptsetup, mke2fs and sgdisk
        run: |
          bash build/static/cryptsetup.sh amd64
          bash build/static/e2fsprogs.sh amd64
          bash build/static/gptfdisk.sh amd64
      - name: Build the static OpenSSH and busybox
        run: |
          bash build/busybox/build.sh out/static
          bash build/openssh/build.sh out/static
      - name: Build a lab release and its .bin
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          COSIGN_PASSWORD: ""
        run: |
          keys="$RUNNER_TEMP/labkeys" lab="$RUNNER_TEMP/lab" work="$RUNNER_TEMP/work"
          mkdir -p "$keys" "$work"
          sudo mount -t tmpfs -o size=16m,mode=0700,uid="$(id -u)" tmpfs "$keys"
          # shellcheck source=build/release/pins.env
          source build/release/pins.env
          KIT_MIN="$KIT_MIN" KERNEL=build/out/kernel/amd64/bzImage \
          KERNELRELEASE="$(cat build/out/kernel/amd64/kernelrelease)" \
          VERITYSETUP=build/out/veritysetup-amd64 \
          OPENSSH=out/static BUSYBOX=out/static/busybox STATIC=build/out \
          KEYS="$keys" OUT="$lab" bash build/lab/build.sh
          # The lab build appends the build number (g<short commit>).
          VERSION="$(cat "$lab/version")"
          go build -o "$work/sneakers-artifact" ./cmd/sneakers-artifact
          tool="$work/sneakers-artifact"
          "$tool" bin-pack --layout "$lab/artifact" --recipient "$keys/update.pub" \
            --version "$VERSION" --arch amd64 --channel lab --out "$work/bin"
          cosign sign-blob --yes --key "$keys/cosign.key" --bundle "$work/bin/header.sigstore.json" \
            --tlog-upload=false --use-signing-config=false "$work/bin/header.json" >/dev/null
          "$tool" bin-seal --work "$work/bin" --bundle "$work/bin/header.sigstore.json" --out "$work/out"
          bin="$work/out/sneakers-appliance-$VERSION-amd64-LAB.bin"
          # The box's path: verify, decrypt with the key in the signed UKI,
          # unpack, then the kit chain on what came out.
          "$tool" bin-verify --release-key "$keys/cosign.pub" --channel lab \
            --identity-uki "$lab/work/sneakers-$VERSION.efi" --extract "$work/unpacked" "$bin"
          "$lab/sneakers-kit" verify "$work/unpacked"
          # Lab and production never cross.
          if "$tool" bin-verify --release-key "$keys/cosign.pub" --channel production "$bin"; then
            echo "a lab .bin verified as production" >&2; exit 1
          fi
          # The lab product bundle the lab build sealed: opened with the key
          # in the signed UKI and checked, and never a production one.
          product="$(ls "$lab"/product/sneakers-product-*-LAB.bin)"
          "$tool" bin-verify --release-key "$keys/cosign.pub" --channel lab \
            --identity-uki "$lab/work/sneakers-$VERSION.efi" --extract "$work/product" "$product"
          if "$tool" bin-verify --release-key "$keys/cosign.pub" --channel production "$product"; then
            echo "a lab product bundle verified as production" >&2; exit 1
          fi
          if [ -s keys/production/fingerprints.txt ] && bash build/release/check-fingerprints.sh "$keys" keys/production/fingerprints.txt; then
            echo "the lab keys passed the production fingerprint check" >&2; exit 1
          fi
          cp "$lab/keys.txt" "$keys/fingerprints.txt"
          if bash build/release/check-production-keys.sh "$keys"; then
            echo "the lab keys passed the production key check" >&2; exit 1
          fi
          {
            echo "### Lab dry run ${VERSION}"
            echo "- $(basename "$bin"): $(stat -c %s "$bin") bytes, verified, decrypted and checked by the lab kit"
            echo "- $(basename "$product"): $(stat -c %s "$product") bytes, verified, decrypted and checked"
            echo "- nothing was published or uploaded"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Wipe the lab keys
        if: always()
        run: sudo umount "$RUNNER_TEMP/labkeys" || true
