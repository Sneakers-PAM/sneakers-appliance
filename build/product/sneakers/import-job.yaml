# The Sneakers bundle's import Job template (docs/import.md). The bundle
# build puts it in the slot at import/job.yaml and fills @MIGRATE_IMAGE@
# with the pinned sneakers-migrate image. The box fills, per step:
#   ${JOB_NAME}  the step's Job name
#   ${ARGS}      the sneakers-migrate command and its flags, a JSON list
#   ${HOST_DIR}  the import directory on the state volume (/import here)
# and writes the result into the sneakers-import stack, which k0s applies.
# The names are the umbrella chart's for a release called sneakers with the
# bundled PostgreSQL and Kratos; the bundle build checks them against its
# rendered stack.
apiVersion: batch/v1
kind: Job
metadata:
  name: ${JOB_NAME}
  namespace: sneakers
  labels:
    app.kubernetes.io/part-of: sneakers
    app.kubernetes.io/name: sneakers-migrate
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: sneakers
        app.kubernetes.io/name: sneakers-migrate
        app.kubernetes.io/component: migrate
        app.kubernetes.io/instance: sneakers
    spec:
      restartPolicy: Never
      serviceAccountName: sneakers-migrate
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: "@MIGRATE_IMAGE@"
          imagePullPolicy: Never
          args: ${ARGS}
          env:
            - name: MIGRATE_OUTPUT_FILE
              value: /import/out/${JOB_NAME}.txt
            - name: MIGRATE_OWNER_PASSWORD_FILE
              value: /import/out/${JOB_NAME}.owner
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: sneakers-bundled
                  key: password
            - name: TARGET_IDENTITY_DSN
              value: postgres://sneakers@sneakers-postgres:5432/sneakers_identity?sslmode=disable
            - name: TARGET_VAULT_DSN
              value: postgres://sneakers@sneakers-postgres:5432/sneakers_vault?sslmode=disable
            - name: TARGET_WORKFLOW_DSN
              value: postgres://sneakers@sneakers-postgres:5432/sneakers_workflow?sslmode=disable
            - name: TARGET_AUDIT_DSN
              value: postgres://sneakers@sneakers-postgres:5432/sneakers_audit?sslmode=disable
            - name: TARGET_KRATOS_ADMIN_URL
              value: http://sneakers-kratos-admin
            - name: TARGET_VAULT_ADDR
              value: sneakers-vault:9091
            - name: TARGET_AUDIT_ADDR
              value: sneakers-audit:9194
            - name: TARGET_TOTP_ENC_KEY
              valueFrom:
                secretKeyRef:
                  name: sneakers-box
                  key: TOTP_ENC_KEY
            - name: MIGRATE_PRINCIPAL
              value: system:sneakers-migrate
            - name: WORKLOAD_TOKEN_FILE
              value: /var/run/secrets/sneakers/token
            - name: LOG_FORMAT
              value: console
            - name: LOG_LEVEL
              value: info
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: import
              mountPath: /import
            - name: workload-token
              mountPath: /var/run/secrets/sneakers
              readOnly: true
      volumes:
        - name: import
          hostPath:
            path: ${HOST_DIR}
            type: Directory
        - name: workload-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: sneakers
                  expirationSeconds: 3600
                  path: token
