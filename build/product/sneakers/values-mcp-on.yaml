#
# The MCP switch's on state, for render.sh's second render: what it adds
# becomes the sneakers-mcp stack, and the gateway and staff web settings it
# changes become that stack's sneakers-mcp-switch ConfigMap.
mcp:
  enabled: true
  ingress:
    enabled: true
    className: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: 'true'
      traefik.ingress.kubernetes.io/router.middlewares: box-page@file
  networkPolicy:
    ingressFrom:
      - namespaceSelector: {}
      - ipBlock:
          cidr: 198.18.0.1/32
      - ipBlock:
          cidr: 10.244.0.1/32  # scrub:allow=private-ip -- k0s's default pod network gateway
hydra:
  enabled: true
gateway:
  env:
    MCP_HEALTH_URL: http://sneakers-mcp:9101/livez
    HYDRA_ENABLED: 'true'
    HYDRA_ISSUER: https://hydra.sneakers.box.invalid/  # scrub:allow=fqdn -- as values.yaml
    MCP_ENABLED: 'true'
    OAUTH_PUBLIC_URL: https://{{ .Values.global.host }}
web-staff:
  env:
    MCP_URL: https://{{ .Values.global.host }}/mcp
