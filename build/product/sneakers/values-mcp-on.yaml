#
# The MCP switch's on state, for render.sh's second render: what it adds
# becomes the sneakers-mcp stack, and the gateway and staff web settings it
# changes become that stack's sneakers-mcp-switch ConfigMap.
mcp:
  enabled: true
  # The resource the MCP server names in its protected-resource metadata
  # (RFC 9728), at the box's own name: an OAuth MCP client reads
  # /.well-known/oauth-protected-resource to find the authorization server
  # (MCP_AUTHORIZATION_SERVER, the gateway at https://<fqdn>). Without it
  # the server serves no metadata.
  env:
    MCP_RESOURCE_URL: https://{{ .Values.global.host }}/mcp
  ingress:
    enabled: true
    className: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: 'true'
      traefik.ingress.kubernetes.io/router.middlewares: box-page@file
  networkPolicy:
    ingressFrom:
      - namespaceSelector: {}
      - ipBlock:
          cidr: 198.18.0.1/32
      - ipBlock:
          cidr: 10.244.0.1/32  # scrub:allow=private-ip -- k0s's default pod network gateway
# Hydra's issuer is https://<fqdn>/oauth, on the box's one name and
# certificate (docs/network.md#the-host-name): the edge routes Hydra's own
# paths under /oauth/ (discovery, the OAuth 2.0 endpoints and userinfo) to
# its public port and strips the prefix (the edge stack's oauth-prefix
# middleware), and Hydra builds its discovery and endpoint URLs from
# urls.self.public. Each path has its trailing slash so no route takes the
# gateway's /oauth2/ paths, and none takes all of /oauth/: the staff app
# serves the MCP consent page at /oauth/consent.
hydra:
  enabled: true
  ingress:
    public:
      enabled: true
      className: traefik
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.tls: 'true'
        traefik.ingress.kubernetes.io/router.middlewares: box-page@file,oauth-prefix@file
      hosts:
        - host: '{{ .Values.global.host }}'
          paths:
            - path: /oauth/.well-known/
              pathType: Prefix
            - path: /oauth/oauth2/
              pathType: Prefix
            - path: /oauth/userinfo
              pathType: Exact
  hydra:
    config:
      urls:
        self:
          issuer: 'https://{{ .Values.global.host }}/oauth'
          public: 'https://{{ .Values.global.host }}/oauth/'
# The edge reaches Hydra's public port from the host network, like the other
# product routes.
bundledNetworkPolicies:
  hydraPublicFrom:
    - namespaceSelector: {}
    - ipBlock:
        cidr: 198.18.0.1/32
    - ipBlock:
        cidr: 10.244.0.1/32  # scrub:allow=private-ip -- k0s's default pod network gateway
gateway:
  env:
    MCP_HEALTH_URL: http://sneakers-mcp:9101/livez
    HYDRA_ENABLED: 'true'
    HYDRA_ISSUER: https://{{ .Values.global.host }}/oauth
    MCP_ENABLED: 'true'
    OAUTH_PUBLIC_URL: https://{{ .Values.global.host }}
web-staff:
  env:
    MCP_URL: https://{{ .Values.global.host }}/mcp
