# The Sneakers product bundle's product.yaml (bundle format v2): what the
# Sneakers bundle declares to the appliance. Pass it to
# build/product/build.sh as PRODUCT_YAML. docs/release.md#productyaml has
# the format.
format: 2
exposed_values:
  # The gateway's one-time setup token for the first product admin
  # (/admin/setup), until the gateway says it has one. The bundle's values
  # point gateway.secretEnv.SETUP_TOKEN at this Secret.
  - name: setup-token
    secret: sneakers/sneakers-setup-token
    key: SETUP_TOKEN
    roles: [owner, admin]
    one_time: true
    consumed_when:
      service: sneakers/sneakers-gateway:http
      path: /setup/state
      field: needsSetup
      equals: false
    label: Sneakers setup token
    link: https://{host}/admin/setup

# What every Sneakers bundle carries, by each image's last path element: the
# bundle check (bundle.CheckProduct) refuses one that's missing any of them.
components:
  - {name: PostgreSQL, image: postgres}
  - {name: Valkey, image: valkey}
  - {name: Ory Kratos, image: kratos}
  - {name: Ory Hydra, image: hydra}
  - {name: Traefik, image: traefik}
  - {name: cert-manager, image: cert-manager-controller}
  - {name: sneakers-identity, image: sneakers-identity}
  - {name: sneakers-vault, image: sneakers-vault}
  - {name: sneakers-workflow, image: sneakers-workflow}
  - {name: sneakers-audit, image: sneakers-audit}
  - {name: sneakers-notify, image: sneakers-notify}
  - {name: sneakers-connector, image: sneakers-connector}
  - {name: sneakers-sshbroker, image: sneakers-sshbroker}
  - {name: sneakers-gateway, image: sneakers-gateway}
  - {name: sneakers-mcp, image: sneakers-mcp}
  - {name: sneakers-web-staff, image: sneakers-web-staff}
  - {name: sneakers-web-admin, image: sneakers-web-admin}

# The MCP page's switch. The sneakers-mcp stack holds the MCP server, Hydra
# (which only the MCP's OAuth flow uses) and the ConfigMap that gives the
# gateway and the staff web app their MCP settings; off by default, so none
# of it runs until an admin turns it on. A change restarts the two so they
# read the ConfigMap, or its absence.
switches:
  - name: mcp
    label: The MCP server
    default: false
    stacks: [sneakers-mcp]
    restart:
      - sneakers/deployment/sneakers-gateway
      - sneakers/deployment/sneakers-web-staff
  # The Import page's switch: on only while an import is open. Its stack
  # holds the migrate service account, so nothing can run as the migrate
  # caller the vault and audit admit at any other time.
  - name: import
    label: Import from an earlier Sneakers
    default: false
    stacks: [sneakers-import]

# The Import page (docs/import.md): an export of an earlier Sneakers comes
# in before the product's own first-run setup. Each step runs as a Job from
# import/job.yaml (build/product/sneakers/import-job.yaml) as uid 65532,
# with the export, its key and the step's output in the import directory.
# Once the setup token is consumed no import opens, unless the box was
# imported (a re-import). After an import the vault restarts to load it.
import:
  label: Import from an earlier Sneakers
  switch: import
  job: import/job.yaml
  uid: 65532
  setup: setup-token
  restart:
    - sneakers/deployment/sneakers-vault

# The keys Sneakers' data can't be opened without: the vault's root key
# and the identity service's TOTP key. The box seals each under
# KeyCustody, so the recovery escrow carries them for a restore onto a
# replacement box (docs/key-custody.md#product-keys).
escrow:
  - name: vault-root-key
    secret: sneakers/sneakers-box
    key: VAULT_ROOT_KEK
  - name: totp-key
    secret: sneakers/sneakers-box
    key: TOTP_ENC_KEY

# The box's own host name, never baked into the bundle: the bundle's values
# set global.host to this placeholder, so every host-dependent setting
# (Kratos's URLs and return URLs, the WebAuthn relying party, the SSH
# websocket, the MCP, OAuth and Hydra addresses) carries it, and the box
# puts its FQDN in its place when it applies the stacks. The Base OS and
# Base Web versions reach the gateway's diagnostics the same way
# (SNEAKERS_APPLIANCE_VERSION and SNEAKERS_APPLIANCE_WEB_VERSION in
# values.yaml), for the product's About.
box_values:
  - value: box.fqdn
    placeholder: sneakers.box.invalid  # scrub:allow=fqdn -- the reserved .invalid name, never resolved
  - value: box.os.version
    placeholder: baseos-version.invalid  # scrub:allow=fqdn -- the reserved .invalid name, never resolved
  - value: box.web.version
    placeholder: baseweb-version.invalid  # scrub:allow=fqdn -- the reserved .invalid name, never resolved

# The Secrets every box makes for itself (internal/boxsecrets): accessd
# generates the values on the box the first time a bundle declares them,
# keeps them on the state volume and writes them as the
# sneakers-appliance-secrets stack, so no bundle carries a secret value and
# no two boxes share one. Updates and reverts keep them. The bundle's stacks
# read them by these names (build/product/sneakers/values.yaml).
box_secrets:
  - secret: sneakers/sneakers-bundled
    keys:
      - {key: password, generate: password}
      - {key: postgres-password, generate: password}
      - {key: valkey-password, generate: password}
      - {key: redis-url, value: "redis://:{valkey-password}@sneakers-valkey:6379/0"}
  - secret: sneakers/sneakers-kratos
    keys:
      - {key: dsn, value: "postgres://sneakers:{sneakers-bundled/password}@sneakers-postgres:5432/sneakers_kratos?sslmode=disable"}
      - {key: secretsDefault, generate: password}
      - {key: secretsCookie, generate: password}
      - {key: secretsCipher, generate: password}
      # Kratos's courier is off (the identity service sends the mail); the
      # chart still reads the key, so it carries the box's relay too.
      - {key: smtpConnectionURI, setting: email.uri}
  - secret: sneakers/sneakers-hydra
    keys:
      - {key: dsn, value: "postgres://sneakers:{sneakers-bundled/password}@sneakers-postgres:5432/sneakers_hydra?sslmode=disable"}
      - {key: secretsSystem, generate: password}
      - {key: secretsCookie, generate: password}
  # The vault root key and the TOTP encryption key (32 bytes each, base64).
  # Losing them loses the data they protect: the recovery escrow carries
  # both (escrow above).
  - secret: sneakers/sneakers-box
    keys:
      - {key: VAULT_ROOT_KEK, generate: key32}
      - {key: TOTP_ENC_KEY, generate: key32}
  - secret: sneakers/sneakers-setup-token
    keys:
      - {key: SETUP_TOKEN, generate: token}
  # The relay password from the Email page, which only ever goes into a
  # Secret (box_settings below hold the rest).
  - secret: sneakers/sneakers-email
    keys:
      - {key: SMTP_PASS, setting: email.password}

# The product's mail (password resets, one-time codes and notices) goes out
# through the identity service, to the relay set on :8443's Email page
# (docs/product-email.md). The box writes the settings as the
# sneakers-email ConfigMap, which the identity service loads whole, and
# the password as the sneakers-email Secret; both live in the
# sneakers-appliance-secrets stack. A change applies the product again and
# then restarts the identity service, so it reads the new settings.
email:
  label: Password resets, one-time codes and notices
  restart:
    - sneakers/deployment/sneakers-identity
box_settings:
  - configmap: sneakers/sneakers-email
    keys:
      - {key: SMTP_HOST, setting: email.host}
      - {key: SMTP_PORT, setting: email.port}
      - {key: SMTP_FROM, setting: email.from}
      - {key: SMTP_USER, setting: email.username}
      - {key: SMTP_TLS_MODE, setting: email.tls}
      - {key: SMTP_TLS_INSECURE, setting: email.skip_verify}
      - {key: SMTP_CA_PEM, setting: email.ca_pem}

# The data paths the box's disk guard watches for growth (docs/disk-layout.md
# "Keeping the disk from filling"), under /var/lib/sneakers-data, where each
# of the stacks' volumes is. The database's write-ahead log is held to
# max_wal_size by PostgreSQL itself (values.yaml); the box warns when it
# passes wal_warn, and never removes a WAL file.
data:
  - name: database
    label: The database
    path: postgres
    wal: pgdata/pg_wal
    wal_warn: 1GiB
