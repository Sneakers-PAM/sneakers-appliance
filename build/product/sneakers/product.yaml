# The Sneakers product bundle's product.yaml (bundle format v2): what the
# Sneakers bundle declares to the appliance. Pass it to
# build/product/build.sh as PRODUCT_YAML. docs/release.md#productyaml has
# the format.
format: 2
exposed_values:
  # The gateway's one-time setup token for the first product admin
  # (/admin/setup), until the gateway says it has one. The bundle's values
  # point gateway.secretEnv.SETUP_TOKEN at this Secret.
  - name: setup-token
    secret: sneakers/sneakers-setup-token
    key: SETUP_TOKEN
    roles: [owner, admin]
    one_time: true
    consumed_when:
      service: sneakers/sneakers-gateway:http
      path: /setup/state
      field: needsSetup
      equals: false
    label: Sneakers setup token
    link: https://{host}/admin/setup

# What every Sneakers bundle carries, by each image's last path element: the
# bundle check (bundle.CheckProduct) refuses one that's missing any of them.
components:
  - {name: PostgreSQL, image: postgres}
  - {name: Valkey, image: valkey}
  - {name: Ory Kratos, image: kratos}
  - {name: Ory Hydra, image: hydra}
  - {name: Traefik, image: traefik}
  - {name: cert-manager, image: cert-manager-controller}
  - {name: sneakers-identity, image: sneakers-identity}
  - {name: sneakers-vault, image: sneakers-vault}
  - {name: sneakers-workflow, image: sneakers-workflow}
  - {name: sneakers-audit, image: sneakers-audit}
  - {name: sneakers-notify, image: sneakers-notify}
  - {name: sneakers-connector, image: sneakers-connector}
  - {name: sneakers-sshbroker, image: sneakers-sshbroker}
  - {name: sneakers-gateway, image: sneakers-gateway}
  - {name: sneakers-mcp, image: sneakers-mcp}
  - {name: sneakers-web-staff, image: sneakers-web-staff}
  - {name: sneakers-web-admin, image: sneakers-web-admin}

# The MCP page's switch. The sneakers-mcp stack holds the MCP server, Hydra
# (which only the MCP's OAuth flow uses) and the ConfigMap that gives the
# gateway and the staff web app their MCP settings; off by default, so none
# of it runs until an admin turns it on. A change restarts the two so they
# read the ConfigMap, or its absence.
switches:
  - name: mcp
    label: The MCP server
    default: false
    stacks: [sneakers-mcp]
    restart:
      - sneakers/deployment/sneakers-gateway
      - sneakers/deployment/sneakers-web-staff
  # The Import page's switch: on only while an import is open. Its stack
  # holds the migrate service account, so nothing can run as the migrate
  # caller the vault and audit admit at any other time.
  - name: import
    label: Import from an earlier Sneakers
    default: false
    stacks: [sneakers-import]

# The Import page (docs/import.md): an export of an earlier Sneakers comes
# in before the product's own first-run setup. Each step runs as a Job from
# import/job.yaml (build/product/sneakers/import-job.yaml) as uid 65532,
# with the export, its key and the step's output in the import directory.
# Once the setup token is consumed no import opens, unless the box was
# imported (a re-import). After an import the vault restarts to load it.
import:
  label: Import from an earlier Sneakers
  switch: import
  job: import/job.yaml
  uid: 65532
  setup: setup-token
  restart:
    - sneakers/deployment/sneakers-vault

# The keys Sneakers' data can't be opened without: the vault's root key
# and the identity service's TOTP key. The box seals each under
# KeyCustody, so the recovery escrow carries them for a restore onto a
# replacement box (docs/key-custody.md#product-keys).
escrow:
  - name: vault-root-key
    secret: sneakers/sneakers-vault-generated
    key: VAULT_ROOT_KEK
  - name: totp-key
    secret: sneakers/sneakers-identity-generated
    key: TOTP_ENC_KEY
