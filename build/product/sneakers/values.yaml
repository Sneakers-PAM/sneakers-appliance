#
# The Sneakers product bundle's values, for every channel: layered over
# sneakers-release's charts/sneakers/examples/values-small-box.yaml by
# render.sh, which turns the render into the bundle's stacks. The MCP and
# Hydra are off here; values-mcp-on.yaml turns them on for the second
# render, whose extra objects become the sneakers-mcp stack (the MCP
# switch, product.yaml).
#
# No secret value is set or generated here: every Secret the stacks read is
# one product.yaml declares as a box secret, made on each box
# (sneakers-bundled, sneakers-kratos, sneakers-hydra, sneakers-box and
# sneakers-setup-token, sneakers-email). The chart still renders its bundled Secrets, which
# render.sh drops.
global:
  # The box has no name of its own at build time; the edge serves every
  # name on 443 (render.sh drops the Ingress hosts).
  host: sneakers.box.invalid  # scrub:allow=fqdn -- the reserved .invalid name, never resolved
  environment: production
  logLevel: error
  logFormat: json
  workloadIdentityIssuer: https://kubernetes.default.svc
bundledSecrets:
  enabled: true
identity:
  # The mail relay comes from the box (the Email page on :8443): the
  # sneakers-email ConfigMap and Secret, both box settings product.yaml
  # declares. The chart's own SMTP defaults are left out.
  env:
    SMTP_HOST: ''
    SMTP_PORT: ''
    SMTP_TLS: ''
    SMTP_FROM: ''
    SMTP_USER: ''
  envFromConfigMaps:
    - name: sneakers-email
      optional: false
  secretEnv:
    TOTP_ENC_KEY:
      secretName: sneakers-box
    SMTP_PASS:
      secretName: sneakers-email
      key: SMTP_PASS
      required: true
vault:
  secretEnv:
    VAULT_ROOT_KEK:
      secretName: sneakers-box
gateway:
  env:
    MCP_HEALTH_URL: ''
    OAUTH_PUBLIC_URL: ''
    MCP_ENABLED: 'false'
    # The box for the product's About and diagnostics: the placeholders
    # product.yaml's box_values declare, which the box replaces with its
    # Base OS and Base Web versions and its FQDN. render.sh adds
    # SNEAKERS_PRODUCT_VERSION, the release's own version.
    SNEAKERS_APPLIANCE_VERSION: baseos-version.invalid  # scrub:allow=fqdn -- the reserved .invalid name, never resolved
    SNEAKERS_APPLIANCE_WEB_VERSION: baseweb-version.invalid  # scrub:allow=fqdn -- the reserved .invalid name, never resolved
    SNEAKERS_APPLIANCE_FQDN: sneakers.box.invalid  # scrub:allow=fqdn -- the reserved .invalid name, never resolved
  secretEnv:
    SETUP_TOKEN:
      secretName: sneakers-setup-token
  ingress:
    enabled: true
    className: traefik
    annotations: &edge
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: 'true'
      traefik.ingress.kubernetes.io/router.middlewares: box-page@file
  networkPolicy:
    # The edge is on the host network: it reaches the pods from the node
    # address and the pod network's gateway.
    ingressFrom: &edgeFrom
      - namespaceSelector: {}
      - ipBlock:
          cidr: 198.18.0.1/32
      - ipBlock:
          cidr: 10.244.0.1/32  # scrub:allow=private-ip -- k0s's default pod network gateway
  envFromConfigMaps: &switch
    - name: sneakers-mcp-switch
      optional: true
mcp:
  enabled: false
hydra:
  enabled: false
web-staff:
  env:
    MCP_URL: ''
    APPLIANCE_BOX_POLLER: 'true'
  ingress:
    enabled: true
    className: traefik
    annotations: *edge
  networkPolicy:
    ingressFrom: *edgeFrom
  envFromConfigMaps: *switch
web-admin:
  ingress:
    enabled: true
    className: traefik
    annotations: *edge
  networkPolicy:
    ingressFrom: *edgeFrom
  env:
    APPLIANCE_BOX_POLLER: 'true'
sshbroker:
  ingress:
    enabled: true
    className: traefik
    annotations: *edge
  networkPolicy:
    ingressFrom: *edgeFrom
postgres:
  # Layered over the small box's settings (values-small-box.yaml). The
  # write-ahead log stays within max_wal_size through PostgreSQL's own
  # checkpoints; the box's disk guard warns past product.yaml's wal_warn
  # and never removes a WAL file itself.
  parameters:
    max_wal_size: 512MB
    min_wal_size: 64MB
