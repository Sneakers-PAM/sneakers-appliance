# LAB ONLY (build/lab/overlay): the image suite's hook. It does nothing
# unless the ESP holds a file named lab-hook, which only the image suite
# writes. In normal operation it reports whether k0s runs before a product
# bundle is installed, then checks k0s, the hello stack and the edge once
# one is, and prints the result.
exec: /bin/sh
args: [/usr/libexec/sneakers/lab-hook]
phases: [normal]
restart: never
