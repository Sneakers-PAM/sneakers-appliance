# THROWAWAY, LAB ONLY: the hello Deployment as the lab product's front
# phase (build/lab/product.yaml): the phase loop places it only once the
# data phase (lab-data) is Ready (docs/upgrades.md#the-phases). Its
# namespace, page and Service are in the always-on hello stack.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  namespace: sneakers-hello
  labels:
    app: hello
    sneakers-appliance/phase: front
    sneakers-appliance/phase-order: "2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello
  template:
    metadata:
      labels:
        app: hello
        sneakers-appliance/phase: front
        sneakers-appliance/phase-order: "2"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: httpd
          image: docker.io/library/busybox@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
          imagePullPolicy: Never
          command: [httpd, -f, -p, "8080", -h, /www]
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
          volumeMounts:
            - name: www
              mountPath: /www
      volumes:
        - name: www
          configMap:
            name: hello
