# INTERIM, LAB ONLY, until Traefik comes with the platform (#102): a
# minimal edge that serves the hello stack on the box's normal ports.
# Traefik runs on the host network and listens on 443 (TLS with the box's
# own certificate, the :8443 one, which k0s-interim hands in as the
# box-tls Secret; without it Traefik's own self-signed default) and on 80,
# which redirects to https. It forwards to the hello NodePort on the node
# address. accessd opens 80 and 443 on the service interface once the
# product bundle is installed (docs/k0s.md). Ping has its own entry point
# on 127.0.0.1:9000 (spec 3), where the kubelet probes it: Traefik's ping
# router has no TLS, so over HTTPS on 443 the hello route would take it.
# /_box/ goes to sneakers-edgefall on 127.0.0.1:9180 (the host's loopback:
# Traefik is on the host network), and when the hello pod doesn't answer
# (502 to 504) the edge serves edgefall's box-state page instead of its
# own error (docs/edge-fallback.md).
# The product's charts publish their routes as Ingresses of the class
# traefik in the sneakers namespace, which Traefik reads with the
# kubernetesingress provider. Its role is cluster-wide (the product's
# namespace belongs to the product stack, which may not exist yet) and
# read-only but for the Ingress status; the provider watches the sneakers
# namespace only. Every router on 443 terminates TLS, so an Ingress without
# a tls block gets box-tls too; the hello route has the lowest priority, so
# a product Ingress for / wins.
apiVersion: v1
kind: Namespace
metadata:
  name: sneakers-edge
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: traefik
  annotations:
    ingressclass.kubernetes.io/is-default-class: "true"
spec:
  controller: traefik.io/ingress-controller # scrub:allow=fqdn
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: edge
  namespace: sneakers-edge
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sneakers-edge
rules:
  - apiGroups: [""]
    resources: [nodes, services, secrets]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, ingressclasses]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses/status]
    verbs: [update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sneakers-edge
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sneakers-edge
subjects:
  - kind: ServiceAccount
    name: edge
    namespace: sneakers-edge
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: edge
  namespace: sneakers-edge
data:
  dynamic.yaml: |
    http:
      routers:
        box:
          rule: PathPrefix(`/_box/`)
          priority: 1000
          entryPoints: [websecure]
          service: box
          tls: {}
        hello:
          rule: PathPrefix(`/`)
          priority: 1
          entryPoints: [websecure]
          service: hello
          middlewares: [box-page]
          tls: {}
      middlewares:
        box-page:
          errors:
            status: ["502-504"]
            service: box
            query: /_box/page
      services:
        box:
          loadBalancer:
            servers:
              - url: http://127.0.0.1:9180
        hello:
          loadBalancer:
            servers:
              - url: http://198.18.0.1:30080
    tls:
      stores:
        default:
          defaultCertificate:
            certFile: /tls/tls.crt
            keyFile: /tls/tls.key
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge
  namespace: sneakers-edge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: edge
  template:
    metadata:
      labels:
        app: edge
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: edge
      automountServiceAccountToken: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: traefik
          image: docker.io/library/traefik@sha256:e849695bc5c317da0cec22bfee4794fd9e15871fe554f864d31b625983e883ff
          imagePullPolicy: Never
          args:
            - --entryPoints.web.address=:80
            - --entryPoints.web.http.redirections.entryPoint.to=websecure
            - --entryPoints.web.http.redirections.entryPoint.scheme=https
            - --entryPoints.websecure.address=:443
            - --entryPoints.websecure.http.tls=true
            - --entryPoints.traefik.address=127.0.0.1:9000
            - --providers.file.filename=/etc/traefik/dynamic.yaml
            - --providers.kubernetesingress
            - --providers.kubernetesingress.ingressClass=traefik
            - --providers.kubernetesingress.namespaces=sneakers
            - --global.checkNewVersion=false
            - --global.sendAnonymousUsage=false
            - --ping=true
            - --ping.entryPoint=traefik
          readinessProbe:
            httpGet:
              host: 127.0.0.1
              path: /ping
              port: 9000
              scheme: HTTP
          securityContext:
            # Root only to bind 80 and 443 on the host network; every other
            # capability is dropped.
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [NET_BIND_SERVICE]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/traefik
              readOnly: true
            - name: tls
              mountPath: /tls
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: edge
        - name: tls
          secret:
            secretName: box-tls
            optional: true
