# Releases a box should not install, written into the signed update index of
# every release built from here (sneakers-artifact index --withdrawn). A box
# with the reader (0.1.0-rc.10 and later) hides each one from its offers and
# says why on the Updates page; a box on an earlier release can't read this
# list and sees only the release notes. Change this file by pull request: the
# reason and the version to use are shown to owners.
#
# kind: product, baseOS or baseWeb. version: the release's version. reason: one
# sentence. use: the version to take instead.
- kind: product
  version: 0.1.0-rc.7
  reason: an update from rc.6 fails; use rc.10
  use: 0.1.0-rc.10
- kind: product
  version: 0.1.0-rc.8
  reason: an update from rc.6 fails; use rc.10
  use: 0.1.0-rc.10
- kind: product
  version: 0.1.0-rc.9
  reason: an update from rc.6 fails; use rc.10
  use: 0.1.0-rc.10
