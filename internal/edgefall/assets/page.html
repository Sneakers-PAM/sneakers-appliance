<!doctype html>
<html lang="en" data-sneakers-box="{{.State}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{.Title}}</title>
<style>{{.Style}}</style>
</head>
<body>
<main class="box" role="status" aria-live="polite">
<p class="mark">Sneakers-PAM</p>
<div class="spin" aria-hidden="true"></div>
<h1 id="sneakers-box-title">{{.Title}}</h1>
<p id="sneakers-box-note">{{.Note}}</p>
</main>
<script src="/_box/poll.js"></script>
</body>
</html>
