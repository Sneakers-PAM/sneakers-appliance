<!doctype html>
<html lang="en" data-sneakers-box="{{.State}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{.Title}}</title>
<style>{{.Style}}</style>
</head>
<body>
<main class="box" role="status" aria-live="polite">
{{if .LogoURI}}<img class="logo" src="{{.LogoURI}}" alt="Sneakers-PAM">{{else}}<svg class="mark" viewBox="0 0 64 64" role="img" aria-label="Sneakers-PAM" focusable="false"><path d="M6 43c0-13 4-25 13-27h8c2 8 9 13 18 14l8 2c5 1 7 5 7 9v2H6z" fill="currentColor"/><rect class="sole" x="4" y="44" width="58" height="10" rx="5"/><circle class="hole" cx="19" cy="29" r="4.2"/><rect class="hole" x="17.4" y="30" width="3.2" height="8" rx="1.2"/><path class="lace" d="M30 23l5-2M34 27l5-2M39 30l5-2" stroke-width="2.6" stroke-linecap="round" fill="none"/></svg>{{end}}
<div class="spin" aria-hidden="true"></div>
<h1 id="sneakers-box-title">{{.Title}}</h1>
<p id="sneakers-box-note">{{.Note}}</p>
{{if .Detail}}<p id="sneakers-box-detail">{{.Detail}}</p>{{end}}
</main>
<script src="/_box/poll.js"></script>
</body>
</html>
